:root {
  --bg: #120f0c; /* 배너 띠와 같은 바탕색 */
  --surface: #120f0c; /* 상자도 바탕과 같은 색, 테두리로만 구분 */
  --surface-2: #1d1813;
  --ink: #ece7d6;
  --muted: #a8998a;
  --line: #3a3026;
  --line-strong: #6b5a45;
  --accent: #f2a93b;
  --accent-ink: #120d02;
  --accent-soft: #3b2f17;
  --sig-g: #3fcf6b;
  --sig-y: #f4d03f;
  --sig-r: #ef5350;
  --warn-bg: #3d2f12;
  --warn-ink: #ffd27a;
  --ped-red: #e5553f;
  --ped-green: #3fbf62;
  --ped-blue: #4a80f0;
  --tile-num: #ece7d6;
  --tile-num-ink: #0e0f1f;
  --tile-op: #f2a93b;
  --tile-op-ink: #1a1200;
  --p0: #ff6b57; --p1: #4fa3ff; --p2: #50d070; --p3: #c27bff; --p4: #ffc23e; --p5: #3fd6e0; --p6: #ff6fb0;
  --terr0: #4a2420; --terr1: #1b3358;
  --cube-top: #e6e9f6; --cube-left: #8f9fe6; --cube-right: #4b5cb0;
  --shadow: 4px 4px 0 #000;
  --font-display: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  --font-body: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  --font-mono: "GalmuriMono11", "Galmuri11", ui-monospace, monospace;
  --r: 0px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
/* 좌우 여백은 본문 묶음(#app)에만 두고, 맨 위 배너 띠는 화면 폭을 가득 채움 */
#app { max-width: calc(980px + 2 * max(16px, env(safe-area-inset-left, 0px))); margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; word-break: keep-all; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }

/* ---------- 첫 화면 ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
#topband { background: var(--bg); }
#topband:empty { display: none; }
.banner { display: block; max-width: 1600px; margin: 0 auto; background: #1b1612; }
.banner img { display: block; width: 100%; height: auto; aspect-ratio: 2000 / 800; }
@media (max-width: 640px) { .banner img { aspect-ratio: 1600 / 800; object-fit: cover; object-position: center; } } /* 휴대폰: 양옆 10%씩 잘라 제목을 크게 */
.hero { display: grid; gap: 14px; padding-block: 12px 28px; border-bottom: 2px solid var(--ink); margin-bottom: 28px; }
.eyebrow, .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.title { font-family: var(--font-display); font-weight: 400; line-height: 1.05; letter-spacing: -.01em; display: grid; gap: 8px; }
.title { gap: 2px; }
.title-pre, .title-main { font-family: var(--font-display); font-weight: 400; color: var(--ink); font-size: clamp(28px, 4.6vw, 44px); line-height: 1.14; letter-spacing: -.01em; text-wrap: balance; word-break: keep-all; }
.lede { max-width: 62ch; color: var(--muted); font-size: 16px; }
.how { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; }
.how b { font-family: var(--font-display); font-weight: 400; color: var(--accent); margin-right: 4px; letter-spacing: .02em; }
.progs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.progs-label { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.prog-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 999px; border: 2px solid var(--ink); background: var(--surface); font-family: var(--font-display); font-size: 17px; letter-spacing: .04em; cursor: pointer; }
.prog-chip .caret { font-family: var(--font-body); font-size: 12px; transition: transform .15s; }
.prog-chip[aria-expanded="true"] { background: var(--ink); color: var(--bg); }
.prog-chip[aria-expanded="true"] .caret { transform: rotate(180deg); }
.prog-panel { margin: -12px 0 28px; padding: 18px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--ink); display: grid; gap: 14px; }
.prog-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.prog-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.prog-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.prog-day { display: grid; gap: 6px; align-content: start; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); min-width: 0; }
.prog-day h3 { font-size: 13px; letter-spacing: .06em; color: var(--muted); }
.prog-day ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prog-item { display: grid; gap: 2px; }
.prog-item .pg-name { font-weight: 700; }
.prog-item .pg-kind { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.prog-item a { font-size: 13px; font-weight: 600; text-decoration: none; width: fit-content; }
.prog-item a::before { content: "→ "; }
.prog-item .soon { font-size: 12px; color: var(--muted); }
.prog-item.ready .pg-name::after { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--sig-g); margin-left: 6px; vertical-align: .15em; }
.games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.gcard { display: grid; gap: 10px; padding: 18px 18px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.gcard:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.gcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.glyph { width: 84px; flex: none; }
.glyph svg { display: block; width: 100%; height: auto; }
.gname { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; }
.gblurb { color: var(--muted); font-size: 14px; }
.gmeta { display: flex; align-items: center; gap: 8px; font-size: 13px; border-top: 1px dashed var(--line); padding-top: 10px; color: var(--muted); }
.lock { font-weight: 600; }
.lock.open { color: var(--sig-g); }
.foot { margin-top: 36px; color: var(--muted); font-size: 13px; max-width: 70ch; }

/* ---------- 게임 화면 ---------- */
.ghead { display: grid; gap: 8px; margin-bottom: 14px; }
.back { font-size: 14px; text-decoration: none; font-weight: 600; width: fit-content; }
.gtitle h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 48px); line-height: 1.47; } /* 1.05 → 1.4배 */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 8px 8px 0 0; white-space: nowrap; }
.tab.on { background: var(--ink); color: var(--bg); }
.prose { max-width: 70ch; display: grid; gap: 12px; }
.prose h4 { font-size: 17px; margin-top: 10px; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.prose code { font-family: var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-size: .92em; }
.dot { display: inline-block; width: .8em; height: .8em; border-radius: 3px; vertical-align: -.05em; }
.dot.g { background: var(--sig-g); } .dot.y { background: var(--sig-y); } .dot.r { background: var(--sig-r); }
.note { color: var(--muted); font-size: 13px; }
.note.warn-note { color: var(--ink); border: 2px dashed var(--accent); padding: 10px 12px; line-height: 1.6; }
.locked { display: grid; gap: 10px; justify-items: start; padding: 22px; border: 2px dashed var(--line-strong); border-radius: var(--r); background: var(--surface); }
.locked strong { font-family: var(--font-display); font-weight: 400; font-size: 22px; }

/* ---------- 공통 조작 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; touch-action: manipulation; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--sig-r); border-color: var(--sig-r); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--line); }
.btn.tiny { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn.big { min-height: 48px; padding: 10px 22px; font-size: 16px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.center { justify-content: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; }
.opt-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg-btn { border: 0; background: none; padding: 8px 14px; font-weight: 600; cursor: pointer; color: var(--muted); min-height: 38px; }
.seg-btn + .seg-btn { border-left: 1px solid var(--line); }
.seg-btn.on { background: var(--ink); color: var(--bg); }
.seg-btn:disabled { cursor: default; }
.seg.small .seg-btn { padding: 5px 10px; font-size: 13px; min-height: 32px; }
.panel-play > .seg { margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.strong { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.hint { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.status { min-height: 1.6em; font-size: 14px; color: var(--muted); }
.status.strong { color: var(--ink); font-weight: 700; }
.center-msg { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 40px 12px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.sub { font-size: 15px; font-weight: 700; }
.result-box { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 18px; margin-top: 14px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--ink); }
.result-box.ok { border-color: var(--sig-g); }
.result-box.bad { border-color: var(--sig-r); }
.result-big { font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.1; }
.chip-tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.chip-tag.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.seat-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.timer { font-family: var(--font-mono); font-size: 12px; color: var(--sig-r); font-weight: 700; }
.input { min-height: 42px; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; width: 100%; min-width: 0; }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); max-width: 280px; }
.table-wrap { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
tr.me td { background: var(--accent-soft); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); transition: opacity .2s, transform .2s; box-shadow: var(--shadow); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast[data-kind="warn"] { background: var(--sig-r); color: #fff; }

/* ---------- 멀티플레이 로비 ---------- */
.mp-choose { display: grid; gap: 16px; }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode-card { display: grid; gap: 10px; align-content: start; padding: 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.mode-card h4 { font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.mode-card p { font-size: 14px; color: var(--muted); }
.join-row { display: flex; gap: 8px; }
.code-input { text-transform: uppercase; letter-spacing: .2em; font-family: var(--font-mono); font-weight: 700; max-width: 150px; }
.mp-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 14px; font-size: 14px; }
.code { font-family: var(--font-mono); letter-spacing: .15em; }
.lobby { display: grid; gap: 12px; justify-items: start; }
.code-big { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r); background: var(--surface); border: 2px solid var(--ink); }
.code-big span { font-size: 13px; color: var(--muted); font-weight: 600; }
.code-big strong { font-size: 32px; line-height: 1; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; width: 100%; max-width: 460px; }
.pitem { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); }
.pitem.me { border-color: var(--accent); }
.pitem.empty { border-style: dashed; color: var(--muted); font-size: 13px; background: transparent; }
.pname { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .btn { margin-left: auto; }
.opts { width: 100%; }
.end-ctl { justify-content: center; margin-top: 14px; }

/* ---------- 삼색 수식 ---------- */
.sq-board { display: grid; gap: 6px; justify-content: center; margin-block: 6px; --sq: min(2.75rem, calc((100vw - 48px) / var(--len) - 5px)); }
.sq-board.compact { --sq: min(2.1rem, calc((100vw - 64px) / var(--len) - 4px)); justify-content: start; }
.sq-row { display: flex; gap: 5px; }
.sq-row.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.sq { width: var(--sq, 2.6rem); height: calc(var(--sq, 2.6rem) * 1.12); display: grid; place-items: center; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-weight: 700; font-size: calc(var(--sq, 2.6rem) * .5); }
.sq.filled { border-color: var(--line-strong); }
.sq.cursor { border-color: var(--accent); }
.sq.f-g { background: var(--sig-g); border-color: var(--sig-g); color: #fff; }
.sq.f-y { background: var(--sig-y); border-color: var(--sig-y); color: #fff; }
.sq.f-r { background: var(--sig-r); border-color: var(--sig-r); color: #fff; }
.kbd { display: grid; gap: 6px; margin-top: 10px; max-width: 560px; margin-inline: auto; }
.kbd-row { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
.key { min-width: 0; flex: 1 1 0; max-width: 52px; height: 46px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--font-mono); font-weight: 700; font-size: 17px; cursor: pointer; touch-action: manipulation; }
.key.op { background: var(--surface-2); }
.key.wide { max-width: 86px; flex-basis: 70px; font-family: var(--font-body); font-size: 14px; }
.key.enter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.key.f-g { background: var(--sig-g); color: #fff; border-color: transparent; }
.key.f-y { background: var(--sig-y); color: #fff; border-color: transparent; }
.key.f-r { background: var(--surface-2); color: var(--muted); opacity: .55; }
.duel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.duel-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.turn-pill { margin-left: auto; font-family: var(--font-mono); font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 13px; }
.duel-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.secret { font-size: 13px; color: var(--muted); }
.secret b { font-family: var(--font-mono); color: var(--ink); letter-spacing: .08em; }

/* ---------- 마법 격자 ---------- */
.magic-info { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.mg-scroll { overflow-x: auto; padding-bottom: 4px; }
.mg { --cell: min(3.1rem, calc((100vw - 40px) / (var(--n) + 1.4))); display: grid; grid-template-columns: repeat(var(--n), var(--cell)) calc(var(--cell) * 1.25); gap: 3px; width: max-content; margin-inline: auto; }
.mg-cell { width: var(--cell); height: var(--cell); border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: calc(var(--cell) * .4); color: var(--accent); padding: 0; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
input.mg-cell { background: var(--bg); }
input.mg-cell:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.mg-cell.given { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.mg-cell.dup { background: var(--sig-r); color: #fff; border-color: var(--sig-r); }
.mg-sum { display: grid; place-items: center; font-family: var(--font-mono); font-size: calc(var(--cell) * .3); font-weight: 700; color: var(--muted); border-radius: 6px; min-height: calc(var(--cell) * .8); }
.mg-sum[data-state="ok"], .mg-sum [data-state="ok"] { color: var(--sig-g); }
.mg-sum[data-state="bad"], .mg-sum[data-state="over"], .mg-sum [data-state="bad"], .mg-sum [data-state="over"] { color: var(--sig-r); }
.mg-sum.diag { display: grid; gap: 0; line-height: 1.2; font-size: calc(var(--cell) * .24); }
.tray { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 14px auto 6px; max-width: 640px; }
.tray-n { min-width: 2.1em; text-align: center; padding: 1px 4px; border-radius: 5px; font-family: var(--font-mono); font-size: 13px; background: var(--surface); border: 1px solid var(--line); }
.tray-n[data-state="used"] { opacity: .3; text-decoration: line-through; }
.tray-n[data-state="dup"] { background: var(--sig-r); color: #fff; border-color: var(--sig-r); }
input.mg-cell { cursor: pointer; caret-color: transparent; }
input.mg-cell.sel { outline: 3px solid var(--accent); outline-offset: 0; background: color-mix(in srgb, var(--accent) 18%, var(--bg)); }
.tray-hint { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0 0; }
.tray.pick { gap: 6px; }
.tray.pick .tray-n { min-width: 2.6em; min-height: 2.4em; font-size: 15px; color: var(--ink); cursor: pointer; display: inline-grid; place-items: center; }
.tray.pick .tray-n:hover { border-color: var(--accent); }
.tray.pick .tray-n.armed { outline: 3px solid var(--accent); outline-offset: 0; color: var(--accent); }
.tray.pick .tray-n[data-state="used"] { opacity: .3; }
.tray-n.erase { color: var(--muted); }
.magic .status { text-align: center; margin-block: 6px; }

/* ---------- 뒤집기 탑 ---------- */
.tw-head, .hv-head, .wl-head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 12px; }
.goal-card { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 12px 16px; background: var(--ink); color: var(--bg); border-radius: var(--r); width: fit-content; margin-bottom: 14px; }
.goal-k { font-size: 12px; letter-spacing: .06em; opacity: .7; font-weight: 600; }
.goal-v { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1; margin-right: 10px; }
.declare { display: grid; gap: 12px; justify-items: center; text-align: center; margin-top: 16px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper .btn { width: 46px; font-size: 20px; }
.step-v { font-family: var(--font-display); font-weight: 400; font-size: 34px; min-width: 3ch; }
.tw-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.moves { font-family: var(--font-mono); font-size: 15px; padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.moves.last { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.toggle { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 13px; cursor: pointer; }
.toggle.on { background: var(--tile-op); color: var(--tile-op-ink); border-color: var(--tile-op); }
.towers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-block: 8px 14px; }
.tw-col { display: grid; grid-template-rows: auto 1fr auto auto; gap: 6px; padding: 8px 6px; border-radius: var(--r); border: 2px solid transparent; min-height: 330px; cursor: default; min-width: 0; }
.tw-col.droppable { border-color: var(--accent); border-style: dashed; cursor: pointer; background: var(--accent-soft); }
.tw-col.source { background: var(--surface-2); }
.tw-label { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.tw-stack { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.tw-base { height: 6px; border-radius: 3px; background: var(--ink); margin-inline: 8px; }
.tw-read { font-family: var(--font-mono); font-size: 13px; text-align: center; color: var(--muted); min-height: 2.6em; overflow-wrap: anywhere; }
.tw-read.hit { color: var(--sig-g); font-weight: 700; }
.tile { position: relative; width: min(76px, 100%); height: 40px; border-radius: 7px; border: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 20px; cursor: pointer; transition: transform .12s; }
.tile:disabled, .tile:not([onclick]) { cursor: default; }
.tile.num { background: var(--tile-num); color: var(--tile-num-ink); }
.tile.op { background: var(--tile-op); color: var(--tile-op-ink); }
.tile .back { position: absolute; right: 5px; top: 2px; font-size: 11px; opacity: .6; }
.tile.sel { transform: translateY(-4px); box-shadow: 0 0 0 3px var(--accent); }
.solution { width: 100%; max-width: 460px; text-align: left; }
.solution summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.solution ol { margin: 8px 0 0; padding-left: 1.3em; }
.log { margin: 6px 0 10px; max-width: 460px; }

/* ---------- 열셋 짐꾼 ---------- */
.peds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ped { display: grid; gap: 8px; padding: 12px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--pc, var(--ped-red)); align-content: start; min-width: 0; }
.ped.red { --pc: var(--ped-red); } .ped.green { --pc: var(--ped-green); } .ped.blue { --pc: var(--ped-blue); }
.ped-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.ped-name { font-weight: 700; white-space: nowrap; }
.ped-sum { font-family: var(--font-mono); font-weight: 700; font-size: 18px; white-space: nowrap; }
.ped-sum.hot { color: var(--sig-r); }
.ped-meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.ped-meter span { display: block; height: 100%; background: var(--pc); }
.rocks { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; }
.rock { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 13px; background: var(--ink); color: var(--bg); box-shadow: inset 0 -3px 0 var(--pc); }
.ped-foot { font-size: 12px; color: var(--muted); }
.reveal { margin-top: 14px; }
.rev-list { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.rev { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.rev.cur { border: 2px solid var(--accent); }
.rev.done { opacity: .5; }
.card-mini { font-family: var(--font-mono); font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 0 6px; }
.chip-mini { font-size: 12px; font-weight: 700; padding: 0 7px; border-radius: 999px; color: #fff; }
.c0 { --cc: var(--ped-red); } .c1 { --cc: var(--ped-green); } .c2 { --cc: var(--ped-blue); }
.chip-mini.c0, .chip-mini.c1, .chip-mini.c2 { background: var(--cc); }
.chip-mini.c3, .chip.c3, .chip-dot.c3 { background: linear-gradient(90deg, var(--ped-red), var(--sig-y), var(--ped-green), var(--ped-blue)); color: #fff; }
.hand { margin-top: 14px; }
.hand.turn { border: 2px solid var(--accent); }
.cards-row, .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.card { width: 46px; height: 62px; border-radius: 8px; border: 2px solid var(--ink); background: var(--surface); font-family: var(--font-display); font-size: 26px; cursor: pointer; display: grid; place-items: center; }
.card.on { background: var(--ink); color: var(--bg); transform: translateY(-3px); }
.card:disabled { opacity: .2; cursor: not-allowed; border-style: dashed; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px; border-radius: 999px; border: 3px solid transparent; background: var(--cc); color: #fff; font-weight: 700; cursor: pointer; }
.chip small { font-family: var(--font-mono); opacity: .85; }
.chip.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.chip:disabled { opacity: .25; cursor: not-allowed; }
.chips-cell { display: flex; gap: 3px; align-items: center; }
.chip-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--cc); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; font-family: var(--font-mono); }
.hv-log { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.hv-log li.boom { color: var(--sig-r); font-weight: 600; }
.rank { margin: 0; padding-left: 1.4em; text-align: left; }

/* ---------- 담장 영토전 ---------- */
.wl-player { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
.wl-player.turn { border: 2px solid var(--ink); }
.wl-score { font-family: var(--font-mono); font-size: 16px; margin-left: 4px; }
.wl-wrap { display: flex; justify-content: center; }
.wl-board { --cs: min(3.6rem, calc((100vw - 48px) / 7)); display: grid; grid-template-columns: repeat(var(--n), var(--cs)); border: 3px solid var(--ink); background: var(--surface); border-radius: 4px; }
.wl-cell { position: relative; width: var(--cs); height: var(--cs); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; }
.wl-cell:nth-child(7n) { border-right: 0; }
.wl-cell:nth-last-child(-n+7) { border-bottom: 0; }
.wl-cell.terr0 { background: var(--terr0); }
.wl-cell.terr1 { background: var(--terr1); }
.wl-cell.reach { background: var(--accent-soft); }
.wl-cell.reach::after { content: ""; width: 22%; height: 22%; border-radius: 50%; background: var(--accent); opacity: .55; }
.wl-cell.dest { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent); }
.wl-cell.lastmv { box-shadow: inset 0 0 0 2px var(--line-strong); }
.piece { width: 62%; height: 62%; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); z-index: 1; }
.piece.sel { outline: 3px solid var(--ink); outline-offset: 2px; }
.w-h, .w-v { position: absolute; background: var(--ink); z-index: 2; border-radius: 3px; pointer-events: none; }
.w-h { left: -3px; right: -3px; bottom: -4px; height: 7px; }
.w-v { top: -3px; bottom: -3px; right: -4px; width: 7px; }
.wall-pick { position: absolute; z-index: 3; border: 0; background: var(--accent); border-radius: 4px; cursor: pointer; padding: 0; animation: pulse 1s infinite alternate; }
.wp-U { top: -5px; left: 8%; right: 8%; height: 10px; }
.wp-D { bottom: -5px; left: 8%; right: 8%; height: 10px; }
.wp-L { left: -5px; top: 8%; bottom: 8%; width: 10px; }
.wp-R { right: -5px; top: 8%; bottom: 8%; width: 10px; }
@keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
.wl-msg { text-align: center; font-weight: 600; color: var(--ink); }

/* ---------- 빨리 풀기 공용 ---------- */
.quick { display: grid; gap: 10px; }
.q-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
.pill.me { border-color: var(--accent); }
.pill.win { background: var(--sig-g); color: #fff; border-color: var(--sig-g); }
.q-prompt { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 4px 10px; font-size: 17px; font-weight: 600; text-align: center; margin-block: 6px; }
.q-big { font-family: var(--font-display); font-weight: 400; font-size: 42px; line-height: 1; color: var(--accent); }
.q-mid { font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--accent); }
.ans-row { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.ans-input { max-width: 140px; text-align: center; font-family: var(--font-mono); font-weight: 700; font-size: 20px; }
.game-area .ans-row + .status, .quick .status { text-align: center; }

/* ---------- 네모 사냥 ---------- */
.nm { display: flex; justify-content: center; }
.nm-grid { --c: min(3.2rem, calc((100vw - 48px) / var(--cols))); display: grid; grid-template-columns: repeat(var(--cols), var(--c)); grid-template-rows: repeat(var(--rows), var(--c)); gap: 0; position: relative; width: max-content; margin-inline: auto; }
.nm-cell { display: grid; place-items: center; border: 1px solid var(--line-strong); margin: -0.5px; background: var(--surface); font-family: var(--font-mono); font-weight: 700; font-size: calc(var(--c) * .42); }
.nm-cell.blank { background: var(--surface-2); }
.nm-cell.neg { color: var(--sig-r); }
.nm-cell.void { background: transparent; border-color: transparent; }
.nm-hl { border: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); border-radius: 4px; z-index: 2; pointer-events: none; }
.nm-explain { display: grid; gap: 10px; justify-items: center; width: 100%; }
.nm-explain .btn.on { background: var(--ink); color: var(--bg); }

/* ---------- 큐브 더미 ---------- */
.cube-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); width: 100%; }
.cube-canvas { display: block; max-width: 100%; cursor: grab; touch-action: pan-y; }
.cube-canvas:active { cursor: grabbing; }
.cube-ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.cube-explain { display: grid; gap: 10px; justify-items: center; }
.hm-grid { display: grid; grid-template-columns: repeat(var(--cols), 34px); gap: 3px; }
.hm-cell { width: 34px; height: 34px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 4px; font-family: var(--font-mono); font-weight: 700; }
.hm-cell.zero { opacity: .35; }

/* ---------- 숨은 차이 찾기 ---------- */
.sp { display: grid; gap: 8px; }
.sp-bar { display: flex; align-items: center; gap: 8px; }
.sp-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sp-frame { border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; line-height: 0; }
.sp-svg { width: 100%; height: auto; display: block; cursor: crosshair; touch-action: manipulation; }
.sp-svg .hit { fill: none; stroke: #18b85c; stroke-width: 4; }
.sp-svg .hit.hinted { stroke: #f6c445; }
.sp-svg .missed { fill: none; stroke: #e53935; stroke-width: 3.5; stroke-dasharray: 7 5; }
.sp-svg .miss path { stroke: #e53935; stroke-width: 4; stroke-linecap: round; }
.result-box .sp { width: 100%; }

/* ---------- 대칭 조각 ---------- */
.sym { display: grid; gap: 10px; }
.sym-scroll { overflow-x: auto; display: flex; justify-content: center; }
.sym-board { --s: min(2.2rem, calc((100vw - 40px) / var(--bw))); display: grid; grid-template-columns: repeat(var(--bw), var(--s)); grid-template-rows: repeat(var(--bh), var(--s)); background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; width: max-content; }
.sym-board.solved { border-color: var(--sig-g); box-shadow: 0 0 0 3px var(--sig-g); }
.sym-cell { border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; padding: 0; cursor: pointer; }
.sym-cell.ghost-ok { background: color-mix(in srgb, var(--accent) 35%, transparent); }
.sym-cell.ghost-bad { background: color-mix(in srgb, var(--sig-r) 35%, transparent); }
.sym-board { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.sym-cell.selp { box-shadow: inset 0 0 0 3px var(--ink); filter: brightness(1.15); }
.sym-cell.lifting { opacity: .35; }
.sym-tray { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; border: 1px dashed var(--line-strong); border-radius: var(--r); }
.sym-piece { padding: 8px; border-radius: 8px; border: 2px solid transparent; background: var(--surface); cursor: pointer; }
.sym-piece.on { border-color: var(--ink); }
.sym-mini { display: grid; grid-template-columns: repeat(var(--w), var(--cs)); grid-template-rows: repeat(var(--h), var(--cs)); gap: 2px; }
.sym-mini span { border-radius: 3px; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .2); }
.sym-explain { display: grid; gap: 8px; justify-items: center; }

/* ---------- 색실 잇기 ---------- */
.lk-wrap { display: flex; justify-content: center; }
.lk-board { --cs: min(3.4rem, calc((100vw - 40px) / var(--n))); position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cs)); grid-auto-rows: var(--cs); border: 3px solid var(--ink); background: var(--surface); border-radius: 4px; user-select: none; -webkit-user-select: none; }
.lk-board.drawing { touch-action: none; cursor: crosshair; }
.lk-cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; }
.lk-cell.open { cursor: pointer; }
.lk-cell.open:hover { background: var(--accent-soft); }
.lk-cell.last { box-shadow: inset 0 0 0 3px var(--accent); }
.lk-piece { position: relative; z-index: 2; width: 70%; height: 70%; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--font-mono); font-size: calc(var(--cs) * .32); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); }
.lk-piece.sm { width: 26px; height: 26px; font-size: 13px; }
.lk-paths { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.lk-line { fill: none; stroke-width: .3; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.lk-pool { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px auto; max-width: 600px; }
.lk-pool-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px 3px 3px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.lk-pool-btn.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent-soft); }
.lk-pool-btn:disabled { opacity: .35; cursor: default; }
.lk-pool-btn small { font-family: var(--font-mono); font-weight: 700; }
.center-text { text-align: center; margin-top: 8px; }

/* ---------- 수순 장기 ---------- */
.jg-layout { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; }
.jg-board-wrap { display: flex; justify-content: center; }
.jg-board { --cs: min(3.6rem, calc((100vw - 40px) / 5)); display: grid; grid-template-columns: repeat(5, var(--cs)); grid-auto-rows: var(--cs); border: 3px solid var(--ink); border-radius: 4px; background: var(--surface); }
.jg-cell { position: relative; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; cursor: default; }
.jg-cell.palace { background: color-mix(in srgb, var(--tile-op) 22%, transparent); }
.jg-cell.home::after { content: "★"; position: absolute; right: 3px; top: 1px; font-size: 12px; color: var(--sig-y); z-index: 4; text-shadow: 0 0 2px var(--ink); }
.jg-cell.last { box-shadow: inset 0 0 0 2px var(--line-strong); }
.jg-cell.can { cursor: pointer; box-shadow: inset 0 0 0 3px var(--accent); }
.jg-cell.sel { background: var(--accent-soft); }
.jg-cell.dest { cursor: pointer; }
.jg-cell.dest::before { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--accent); opacity: .7; z-index: 3; }
.jg-piece { position: relative; z-index: 2; width: 72%; height: 72%; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-size: calc(var(--cs) * .3); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); }
.jg-piece.king { width: 84%; height: 84%; border-radius: 30%; font-size: calc(var(--cs) * .36); outline: 2px solid var(--ink); }
.jg-side { display: grid; gap: 10px; align-content: start; min-width: 0; }
.jg-slots, .jg-hand, .jg-seq-cards { display: flex; flex-wrap: wrap; gap: 6px; }
.jg-card { display: grid; gap: 3px; justify-items: center; width: 64px; padding: 6px 4px; border-radius: 8px; border: 2px solid var(--line-strong); background: var(--surface); font-size: 12px; }
button.jg-card { cursor: pointer; }
.jg-card b { font-size: 12px; white-space: nowrap; }
.jg-card.slot.empty { border-style: dashed; color: var(--muted); min-height: 76px; align-content: center; }
.jg-card.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.jg-card.used { opacity: .45; }
.jg-card.secret { border-style: dashed; }
.jg-card.back { min-height: 76px; align-content: center; background: var(--surface-2); color: var(--muted); }
.jg-pat { display: grid; grid-template-columns: repeat(5, 9px); grid-auto-rows: 9px; gap: 1px; }
.jg-pat span { background: var(--surface-2); border-radius: 1px; }
.jg-pat span.mv { background: var(--accent); }
.jg-pat span.me { background: var(--ink); border-radius: 50%; }
.jg-seq { display: grid; gap: 4px; }
.jg-seq-name { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }

/* ---------- 첫 화면 일차별 구역 ---------- */
.gsec { display: grid; gap: 12px; margin-bottom: 26px; }
.gsec-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.gsec-title small { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 600; }
.gsec.final .gsec-title { color: var(--accent); }

@media (max-width: 640px) {
  .jg-layout { grid-template-columns: minmax(0, 1fr); }

  .games { grid-template-columns: minmax(0, 1fr); }
  .duel-grid { grid-template-columns: minmax(0, 1fr); }
  .peds { gap: 6px; }
  .ped { padding: 8px; }
  .rock { width: 24px; height: 24px; font-size: 12px; }
  .ped-top { flex-direction: column; align-items: flex-start; gap: 0; }
  .ped-sum { font-size: 15px; }
  .cards-row { gap: 5px; }
  .card { width: 38px; height: 52px; font-size: 22px; }
  .tw-col { min-height: 290px; }
  .tile { height: 36px; font-size: 18px; }
  .goal-v { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* ================= 8비트 마감 ================= */
html { -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale; }
body { font-size: 15px; line-height: 1.65; }
*, *::before, *::after { border-radius: 0 !important; }
h1, h2, h3, h4, .gname, .result-big, .title-pre, .title-main, .goal-v, .step-v, .q-big, .q-mid, .mode-card h4, .locked strong, .prog-head h2, .gsec-title { font-weight: 700; letter-spacing: 0; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px dashed var(--accent); outline-offset: 2px; }

/* 픽셀 원: 계단 모양으로 깎은 원 */
.piece, .rock, .lk-piece, .jg-piece:not(.king), .seat-dot, .chip-dot, .dot, .wl-cell.reach::after, .jg-cell.dest::before, .chip-mini {
  clip-path: polygon(30% 0, 70% 0, 70% 8%, 85% 8%, 85% 15%, 92% 15%, 92% 30%, 100% 30%, 100% 70%, 92% 70%, 92% 85%, 85% 85%, 85% 92%, 70% 92%, 70% 100%, 30% 100%, 30% 92%, 15% 92%, 15% 85%, 8% 85%, 8% 70%, 0 70%, 0 30%, 8% 30%, 8% 15%, 15% 15%, 15% 8%, 30% 8%);
}
.chip-mini { clip-path: none; }
.piece.sel { outline: none; }
.wl-cell:has(.piece.sel) { background: var(--accent-soft); box-shadow: inset 0 0 0 3px var(--accent); }
.jg-piece.king { outline: 2px solid #000; box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .35), inset 3px 3px 0 rgba(255, 255, 255, .18); }

/* 버튼: 두꺼운 테두리 + 눌리는 그림자 */
.btn, .seg, .toggle, .key, .card, .chip, .prog-chip, .lk-pool-btn, .sym-piece, .jg-card, .tab {
  box-shadow: 3px 3px 0 #000;
}
.btn { border: 2px solid var(--line-strong); background: var(--surface-2); transition: transform .05s, box-shadow .05s; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:active:not(:disabled), .key:active, .card:active:not(:disabled), .chip:active:not(:disabled), .prog-chip:active, .lk-pool-btn:active:not(:disabled), .jg-card:active { transform: translate(3px, 3px); box-shadow: none; }
.btn.primary { background: var(--accent); border-color: #000; color: var(--accent-ink); box-shadow: 3px 3px 0 #000, inset -3px -3px 0 rgba(0, 0, 0, .25); }
.btn.primary:hover:not(:disabled) { color: var(--accent-ink); filter: brightness(1.08); }
.btn.danger { border-color: #000; }
.btn.ghost { box-shadow: none; background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); }
.btn:disabled { box-shadow: none; }
.seg { border: 2px solid var(--line-strong); background: var(--surface); }
.seg-btn + .seg-btn { border-left: 2px solid var(--line); }
.seg-btn.on { background: var(--accent); color: var(--accent-ink); }
.tabs { border-bottom: 2px solid var(--line-strong); gap: 6px; }
.tab { border: 2px solid var(--line-strong); border-bottom: 0; background: var(--surface); color: var(--muted); box-shadow: none; }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill { border: 2px solid var(--line); background: var(--surface); }
.pill.strong { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-tag { border: 1px solid var(--line-strong); }
.input { border: 2px solid var(--line-strong); background: #0c0a08; }
.input:focus { outline: none; border-color: var(--accent); }

/* 상자: 각진 판넬 */
.gcard, .panel, .mode-card, .locked, .result-box, .prog-panel, .code-big, .plist .pitem, .mp-bar, .cube-wrap, .ped, .hand, .lobby .code-big, .goal-card, .prog-day, .sym-tray, .rev, .wl-player {
  border-width: 2px; border-style: solid; border-color: var(--line-strong);
}
.gcard, .panel, .mode-card, .result-box, .prog-panel, .cube-wrap, .goal-card { box-shadow: var(--shadow); }
.gcard { background: var(--surface); }
.gcard:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; border-color: var(--accent); }
.gcard .gname { color: var(--accent); font-size: 26px; }
.gmeta { border-top: 2px dashed var(--line); }
.result-box { border-color: var(--accent); background: var(--surface); }
.result-box.ok { border-color: var(--sig-g); }
.result-box.bad { border-color: var(--sig-r); }
.result-big { color: var(--accent); }
.goal-card { background: var(--surface-2); color: var(--ink); border-color: var(--accent); }
.goal-v { color: var(--accent); }
.locked { border-style: dashed; }
.mp-bar { background: var(--surface); }
.ped { border-top-width: 8px; border-top-color: var(--pc, var(--ped-red)); }
.wl-player.turn { border-color: var(--accent); }
.hand.turn { border-color: var(--accent); }
.plist .pitem.me { border-color: var(--accent); }

/* 첫 화면 */
.hero { border-bottom: 2px dashed var(--line-strong); }
.eyebrow { color: var(--accent); letter-spacing: .04em; }
.eyebrow::before { content: "🧠 "; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.banner { border: 0; box-shadow: none; }
.how b { color: var(--accent); font-weight: 700; }
.prog-chip { border: 2px solid var(--accent); color: var(--accent); background: var(--surface); }
.prog-chip[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
.lock.open { color: var(--sig-g); }
.glyph svg, .sp-svg { shape-rendering: crispEdges; }
.back { color: var(--accent); }
.back::before { content: ""; }
.gtitle h1 { color: var(--accent); }
.foot { border-top: 2px dashed var(--line); padding-top: 14px; }

/* 게임 판 */
.sq { border-width: 2px; }
.key { border: 2px solid var(--line-strong); background: var(--surface-2); }
.key.enter { border-color: #000; }
.mg-cell { border-width: 2px; }
input.mg-cell { background: #0c0a08; }
.tile { box-shadow: inset -3px -3px 0 rgba(0, 0, 0, .3), 2px 2px 0 #000; }
.wl-board, .lk-board, .jg-board, .sym-board, .nm-grid { box-shadow: var(--shadow); }
.wl-board, .lk-board, .jg-board, .sym-board { border-color: var(--line-strong); }
.w-h, .w-v { background: var(--accent); }
.wall-pick { background: var(--sig-g); }
.card { border-color: var(--line-strong); background: var(--surface-2); }
.card.on { background: var(--accent); color: var(--accent-ink); }
.rock { box-shadow: inset 0 -3px 0 var(--pc); }
.nm-hl { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
.mg-sum[data-state="ok"], .mg-sum [data-state="ok"] { color: var(--sig-g); }
#toast { border: 2px solid var(--accent); box-shadow: var(--shadow); background: var(--surface-2); color: var(--ink); }
#toast[data-kind="warn"] { border-color: var(--sig-r); background: #3a1414; color: #fff; }
.timer { color: var(--sig-r); }
table th { color: var(--accent); }
tr.me td { background: var(--accent-soft); }
.prose code { border: 1px solid var(--line-strong); background: #0c0a08; }
.prose h4 { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .eyebrow::before { animation: none; } }

/* 게임 후 숙소 배정 안내 방송 */
.announce { margin-top: 16px; padding: 14px 16px; display: grid; gap: 10px; border: 2px solid var(--accent); background: var(--surface); box-shadow: var(--shadow); }
.announce-head { color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.announce-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ann { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; padding: 4px 6px; }
.ann.me { background: var(--accent-soft); }
.ann-tag { flex: none; font-size: 12px; font-weight: 700; padding: 1px 8px; border: 2px solid currentColor; }
.ann.live .ann-tag, .ann.live .ann-place { color: var(--sig-g); }
.ann.prison .ann-tag, .ann.prison .ann-place { color: var(--sig-r); }
.ann.exile .ann-tag, .ann.exile .ann-place { color: var(--p3); }

/* 잘하는 방법: 움직이는 그림 설명 */
.demo { display: block; }
.demo-box { margin: 4px 0 10px; padding: 12px; display: grid; gap: 10px; justify-items: center; border: 2px dashed var(--accent); background: var(--surface-2); }

<script>
/* ---- core.js ---- */
/* 공통 유틸: DOM 헬퍼, 난수, 저장소, 진행 기록 */
(function () {
  const App = (globalThis.App = globalThis.App || {});
  App.games = App.games || [];

  // ---------- 난수 ----------
  const R = (App.rng = {
    int(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); },
    pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    },
    chance(p) { return Math.random() < p; },
  });

  // ---------- 저장소 (브라우저 저장소가 막혀도 동작) ----------
  const mem = {};
  App.store = {
    get(k, d) {
      try {
        const v = globalThis.localStorage && localStorage.getItem('bgr.' + k);
        if (v != null) return JSON.parse(v);
      } catch (e) { /* 무시 */ }
      return k in mem ? mem[k] : d;
    },
    set(k, v) {
      mem[k] = v;
      try { globalThis.localStorage && localStorage.setItem('bgr.' + k, JSON.stringify(v)); } catch (e) { /* 무시 */ }
    },
  };

  App.progress = {
    plays(id) { return App.store.get('plays.' + id, 0); },
    best(id) { return App.store.get('best.' + id, null); },
    finish(id, info) {
      const n = App.progress.plays(id) + 1;
      App.store.set('plays.' + id, n);
      if (info && typeof info.score === 'number') {
        const b = App.progress.best(id);
        const better = info.lowerIsBetter ? (b == null || info.score < b) : (b == null || info.score > b);
        if (better) App.store.set('best.' + id, info.score);
      }
      return n;
    },
  };

  // ---------- DOM ----------
  App.h = function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v; // 내부에서 작성한 정적 문자열에만 사용
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') { for (const sk in v) { if (sk.startsWith('--')) el.style.setProperty(sk, String(v[sk])); else el.style[sk] = v[sk]; } }
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  };

  App.clear = function (el) { while (el.firstChild) el.removeChild(el.firstChild); return el; };

  let toastTimer = null;
  App.toast = function (msg, kind) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.dataset.kind = kind || '';
    el.hidden = false;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove('show'); el.hidden = true; }, 2600);
  };

  // 사람이 입력한 닉네임 정리 (제어문자 제거, 12자 제한)
  App.cleanNick = function (s) {
    return String(s || '')
      .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g, '')
      .trim()
      .slice(0, 12) || '플레이어';
  };

  App.fmtTime = function (ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
})();

/* ---- avatar.js ---- */
/* 픽셀 캐릭터: 모양(App.avatarShapes, 16×16 글자 그림) × 색 10가지
 *
 * - 캐릭터 값은 [모양 번호, 색 번호]. 처음 오면 무작위로 정해 이 브라우저에 기억 (App.avatar.mine)
 * - 그림 글자: '.' 투명, K 테두리, S/s 피부·피부 그늘, H/h 머리카락·밝은 머리,
 *   W/w 흰색·밝은 회색, E 눈·짙은 색, R 볼·입(빨강), Y 노랑(불빛), G/g 금속·짙은 금속, O 주황(부리·코),
 *   U/u 중간 피부·그늘, T/t 짙은 피부·그늘,
 *   C/c 고른 색·그 그늘  ← 색을 바꾸면 C/c 만 바뀜
 * - 그리기는 SVG 사각형 (선명한 픽셀). 자리 색 테두리를 두른 작은 표시는 App.avatar.seat(W, i)
 */
(function () {
  const App = (globalThis.App = globalThis.App || {});
  const N = 16;
  const FIXED = {
    K: '#1d1b22', S: '#f3c9a1', s: '#d79f76', H: '#3b2a22', h: '#6a4c3b', W: '#f7f6f2', w: '#c8ccd4',
    E: '#16141a', R: '#e2575b', Y: '#f6cf45', G: '#a8b0ba', g: '#6c7480', O: '#f0913a',
    U: '#c98d5f', u: '#a2693f', T: '#8a5a3c', t: '#6a4128', // 중간·짙은 피부와 그늘
  };
  const COLORS = [
    { id: 'red', name: '빨강', C: '#e5484d', c: '#a52a2f' },
    { id: 'orange', name: '주황', C: '#f7832a', c: '#b3561a' },
    { id: 'yellow', name: '노랑', C: '#f2c230', c: '#b1861a' },
    { id: 'lime', name: '연두', C: '#8cc63f', c: '#5c8a25' },
    { id: 'green', name: '초록', C: '#2f9e62', c: '#1d6b41' },
    { id: 'sky', name: '하늘', C: '#4cc3e6', c: '#2a87a6' },
    { id: 'blue', name: '파랑', C: '#3b6fe0', c: '#2447a0' },
    { id: 'purple', name: '보라', C: '#8e5cd9', c: '#5e3a99' },
    { id: 'pink', name: '분홍', C: '#ec6aa8', c: '#ac3f74' },
    { id: 'black', name: '검정', C: '#5e5e6a', c: '#3a3a44' }, // 테두리(K)·눈과 구분되게 조금 밝은 검정
  ];
  const LETTERS = new Set(['.', 'C', 'c', ...Object.keys(FIXED)]);
  const shapes = () => App.avatarShapes || [];

  function palette(ci) { const col = COLORS[ci] || COLORS[0]; return Object.assign({ C: col.C, c: col.c }, FIXED); }

  function validate(sh) {
    const e = [];
    if (!sh || !/^[a-z][a-z0-9-]{1,15}$/.test(sh.id || '')) e.push('id');
    if (typeof sh.name !== 'string' || sh.name.length < 1 || sh.name.length > 6) e.push('name 1~6자');
    if (!Array.isArray(sh.grid) || sh.grid.length !== N) { e.push('grid 는 16줄'); return e; }
    sh.grid.forEach((r, y) => {
      if (typeof r !== 'string' || [...r].length !== N) e.push(y + '번째 줄은 16글자');
      else [...r].forEach((ch, x) => { if (!LETTERS.has(ch)) e.push(`(${x},${y}) '${ch}' 못 쓰는 글자`); });
    });
    const all = sh.grid.join('');
    if (!/[C]/.test(all)) e.push('색이 바뀌는 C 칸이 없음');
    if (!/K/.test(all)) e.push('테두리 K 가 없음');
    return e;
  }

  // 같은 줄에서 같은 색이 이어지면 사각형 하나로
  function rects(sh, ci) {
    const pal = palette(ci), out = [];
    sh.grid.forEach((row, y) => {
      const cs = [...row];
      for (let x = 0; x < N;) {
        const ch = cs[x];
        if (ch === '.' || !pal[ch]) { x++; continue; }
        let w = 1;
        while (x + w < N && cs[x + w] === ch) w++;
        out.push([x, y, w, pal[ch]]);
        x += w;
      }
    });
    return out;
  }

  const NS = 'http://www.w3.org/2000/svg';
  function svg(a, size, label) {
    const list = shapes();
    a = norm(a);
    const sh = list[a[0]] || list[0];
    const el = document.createElementNS(NS, 'svg');
    el.setAttribute('viewBox', '0 0 16 16');
    el.setAttribute('width', String(size || 32));
    el.setAttribute('height', String(size || 32));
    el.setAttribute('shape-rendering', 'crispEdges');
    el.setAttribute('class', 'av-svg');
    if (label) { el.setAttribute('role', 'img'); el.setAttribute('aria-label', label); } else el.setAttribute('aria-hidden', 'true');
    if (!sh) return el;
    for (const [x, y, w, fill] of rects(sh, a[1])) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', w); r.setAttribute('height', 1); r.setAttribute('fill', fill);
      el.appendChild(r);
    }
    return el;
  }

  function norm(a) {
    const ns = shapes().length || 1;
    if (!Array.isArray(a) || a.length !== 2) return [0, 0];
    const s = a[0] | 0, c = a[1] | 0;
    return [((s % ns) + ns) % ns, ((c % COLORS.length) + COLORS.length) % COLORS.length];
  }
  const valid = (a) => Array.isArray(a) && a.length === 2 && Number.isInteger(a[0]) && Number.isInteger(a[1]) && a[0] >= 0 && a[0] < shapes().length && a[1] >= 0 && a[1] < COLORS.length;

  // 무작위: 이미 쓰인 것(taken)과 모양·색이 겹치지 않게 최대한
  function random(taken) {
    const ns = shapes().length || 1, nc = COLORS.length;
    taken = (taken || []).filter(valid);
    let best = null, bestScore = -1;
    for (let t = 0; t < 40; t++) {
      const a = [Math.floor(Math.random() * ns), Math.floor(Math.random() * nc)];
      const score = (taken.some((x) => x[0] === a[0]) ? 0 : 2) + (taken.some((x) => x[1] === a[1]) ? 0 : 1);
      if (score > bestScore) { best = a; bestScore = score; }
      if (score === 3) break;
    }
    return best;
  }

  function mine() {
    let a = null;
    try { a = App.store.get('avatar', null); } catch (e) { /* 무시 */ }
    if (!valid(a)) { a = random(); try { App.store.set('avatar', a); } catch (e) { /* 무시 */ } }
    return a;
  }
  function setMine(a) { if (valid(a)) { try { App.store.set('avatar', a); } catch (e) { /* 무시 */ } } }

  const nameOf = (a) => { a = norm(a); const sh = shapes()[a[0]]; return (COLORS[a[1]] || COLORS[0]).name + ' ' + (sh ? sh.name : ''); };

  // 자리 색 테두리를 두른 작은 캐릭터 (게임 중 이름표 등). 캐릭터가 없으면 예전 색 점
  function seat(W, i, size, extraCls) {
    const p = W && W.pl && W.pl[i];
    if (!p || !valid(p.a)) return App.h('span', { class: 'seat-dot' + (extraCls ? ' ' + extraCls : ''), style: extraCls ? null : { background: `var(--p${i})` } });
    const box = App.h('span', { class: 'av-chip' + (extraCls ? ' ' + extraCls : ''), style: extraCls ? null : { '--pc': `var(--p${i})` } });
    box.append(svg(p.a, size || 32));
    return box;
  }

  // 모양·색 고르기 (onChange(a) 로 알림). 미리 보기 + 모양 줄 + 색 줄 + 무작위
  function picker(cur, onChange, o) {
    o = o || {};
    let a = valid(cur) ? cur.slice() : mine();
    const root = App.h('div', { class: 'av-picker' + (o.compact ? ' compact' : '') });
    function paint() {
      App.clear(root);
      const big = App.h('div', { class: 'av-big' }, svg(a, o.compact ? 48 : 64, '내 캐릭터: ' + nameOf(a)));
      const shapesRow = App.h('div', { class: 'av-row', role: 'radiogroup', 'aria-label': '캐릭터 모양' },
        shapes().map((sh, i) => App.h('button', {
          class: 'av-opt' + (i === a[0] ? ' on' : ''), type: 'button', role: 'radio', 'aria-checked': i === a[0] ? 'true' : 'false', title: sh.name, 'aria-label': '모양 ' + sh.name,
          onclick: () => set([i, a[1]]),
        }, svg([i, a[1]], 32))));
      const colorRow = App.h('div', { class: 'av-row colors', role: 'radiogroup', 'aria-label': '캐릭터 색' },
        COLORS.map((col, i) => App.h('button', {
          class: 'av-swatch' + (i === a[1] ? ' on' : ''), type: 'button', role: 'radio', 'aria-checked': i === a[1] ? 'true' : 'false', title: col.name, 'aria-label': '색 ' + col.name,
          style: { background: col.C }, onclick: () => set([a[0], i]),
        })));
      root.append(
        App.h('div', { class: 'av-head' }, big,
          App.h('div', { class: 'av-meta' }, App.h('span', { class: 'av-title' }, o.title || '내 캐릭터'), App.h('b', { class: 'av-name' }, nameOf(a)),
            App.h('div', { class: 'row wrap' },
              App.h('button', { class: 'btn tiny', type: 'button', onclick: () => set(random([a])) }, '🎲 무작위'),
              o.onClose ? App.h('button', { class: 'btn tiny ghost', type: 'button', onclick: o.onClose }, '닫기') : null))),
        App.h('p', { class: 'av-label' }, '모양'), shapesRow,
        App.h('p', { class: 'av-label' }, '색'), colorRow);
    }
    function set(n) { a = n; setMine(a); paint(); if (onChange) onChange(a.slice()); }
    paint();
    return root;
  }

  App.avatar = { N, COLORS, FIXED, palette, validate, rects, svg, norm, valid, random, mine, setMine, nameOf, seat, picker, shapes };
})();

/* ---- eq.js ---- */
/* 수식 계산기: 유리수로 정확하게 계산 (부동소수점 오차 없음)
 * 문자: 0-9 + - * / ^ =   (화면에는 × ÷ − 로 표시)
 * 우선순위: ^ (오른쪽 결합) > × ÷ > + −, 음수 부호(단항 −)와 01 같은 앞자리 0은 허용하지 않음
 */
(function () {
  const App = (globalThis.App = globalThis.App || {});
  const LIMIT = 1e12;

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
  function norm(n, d) {
    if (d === 0) throw new Error('0으로 나눌 수 없어요');
    if (d < 0) { n = -n; d = -d; }
    const g = gcd(n, d);
    n /= g; d /= g;
    if (Math.abs(n) > LIMIT || d > LIMIT) throw new Error('수가 너무 커요');
    return [n, d];
  }
  const add = (a, b) => norm(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
  const sub = (a, b) => norm(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
  const mul = (a, b) => norm(a[0] * b[0], a[1] * b[1]);
  const div = (a, b) => { if (b[0] === 0) throw new Error('0으로 나눌 수 없어요'); return norm(a[0] * b[1], a[1] * b[0]); };
  function pow(a, b) {
    if (b[1] !== 1) throw new Error('지수는 정수여야 해요');
    const e = b[0];
    if (e < 0) throw new Error('지수는 0 이상이어야 해요');
    if (e > 40) throw new Error('지수가 너무 커요');
    if (e === 0) { if (a[0] === 0) throw new Error('0의 0제곱은 정할 수 없어요'); return [1, 1]; }
    let r = [1, 1];
    for (let i = 0; i < e; i++) r = mul(r, a);
    return r;
  }

  // 문자열을 토큰(숫자/연산자)으로
  function tokenize(s) {
    const out = [];
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (c >= '0' && c <= '9') {
        let j = i;
        while (j < s.length && s[j] >= '0' && s[j] <= '9') j++;
        const num = s.slice(i, j);
        if (num.length > 1 && num[0] === '0') throw new Error('여러 자리 수는 0으로 시작할 수 없어요');
        out.push({ k: 'n', v: [parseInt(num, 10), 1] });
        i = j;
      } else if ('+-*/^'.includes(c)) { out.push({ k: 'o', v: c }); i++; }
      else throw new Error('쓸 수 없는 문자: ' + c);
    }
    return out;
  }

  function evalTokens(t) {
    let i = 0;
    function primary() {
      const x = t[i];
      if (!x || x.k !== 'n') throw new Error('연산자 자리가 맞지 않아요');
      i++;
      return x.v;
    }
    function power() {
      const base = primary();
      if (t[i] && t[i].k === 'o' && t[i].v === '^') { i++; return pow(base, power()); }
      return base;
    }
    function term() {
      let v = power();
      while (t[i] && t[i].k === 'o' && (t[i].v === '*' || t[i].v === '/')) {
        const op = t[i++].v;
        const r = power();
        v = op === '*' ? mul(v, r) : div(v, r);
      }
      return v;
    }
    function expr() {
      let v = term();
      while (t[i] && t[i].k === 'o' && (t[i].v === '+' || t[i].v === '-')) {
        const op = t[i++].v;
        const r = term();
        v = op === '+' ? add(v, r) : sub(v, r);
      }
      return v;
    }
    if (!t.length) throw new Error('빈 식이에요');
    const v = expr();
    if (i !== t.length) throw new Error('연산자 자리가 맞지 않아요');
    return v;
  }

  function evalExpr(s) { return evalTokens(tokenize(s)); }

  // 등식 검사: {ok, msg}. 등호는 1개 이상, 등호로 나뉜 모든 식의 값이 같아야 함 (예: 2+2=4=1+3)
  function checkEquation(s) {
    const parts = s.split('=');
    if (parts.length < 2) return { ok: false, msg: '등호(=)가 1개 이상 있어야 해요' };
    if (parts.some((x) => !x)) return { ok: false, msg: '등호 양쪽에 모두 식이 있어야 해요' };
    try {
      const vals = parts.map((x) => evalExpr(x));
      if (vals.some((v) => v[0] !== vals[0][0] || v[1] !== vals[0][1])) return { ok: false, msg: '등호로 나뉜 값이 모두 같아야 해요' };
      return { ok: true };
    } catch (e) { return { ok: false, msg: e.message }; }
  }

  const SHOW = { '*': '×', '/': '÷', '-': '−', '+': '+', '^': '^', '=': '=' };
  function show(s) { return String(s).split('').map((c) => SHOW[c] || c).join(''); }
  function fracStr(v) { return v[1] === 1 ? String(v[0]) : v[0] + '/' + v[1]; }

  App.eq = { tokenize, evalTokens, evalExpr, checkEquation, show, fracStr, SHOW };
})();

/* ---- fire.js ---- */
/* Firebase 실시간 방: 로그인 없이(익명) 방 코드만으로 연결 (GitHub Pages 판에서 사용)
 *
 * 데이터 모양: rooms/{방이름}/peers/{접속 id} = { u: 익명 uid, p: presence(JSON 글자), t: 서버 시각 }
 *  - 각 화면은 자기 칸 하나만 씀. 창을 닫거나 연결이 끊기면 서버가 그 칸을 지움(onDisconnect)
 *  - 방 목록은 읽을 수 없고, 코드를 알아야 그 방을 읽을 수 있음 (database.rules.json)
 */
(function () {
  const App = (globalThis.App = globalThis.App || {});

  function rid() { return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 8); }
  function deepFreeze(o) { if (o && typeof o === 'object' && !Object.isFrozen(o)) { Object.freeze(o); for (const k in o) deepFreeze(o[k]); } return o; }
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve(); s.onerror = () => reject(new Error('스크립트를 불러오지 못했어요'));
      document.head.append(s);
    });
  }

  let kitP = null;   // 연결 준비 (한 번만)
  let live = 0, offTimer = null;
  let offset = 0;

  // ----- 연결 상태: 'idle' 시작 전 | 'connecting' | 'ok' | 'full' 접속자 가득(로그인은 됐는데 DB 연결이 안 됨) | 'offline' -----
  // 무료 요금제는 동시 연결 100개까지라, 넘으면 새 연결이 거절돼요. 거절은 오류 없이 재시도만 반복되므로 시간으로 판단
  const CONNECT_WAIT = 9000;
  let status = 'idle', stTimer = null, paused = false, autoTimer = null, K0 = null;
  let connected = false; // .info/connected 의 실제 값 (멈춰 둔 동안에도 갱신)
  const statusSubs = new Set();
  function setStatus(s) {
    if (s === status) return;
    status = s;
    clearInterval(autoTimer); autoTimer = null;
    // 가득 찬 동안에는 30초마다 다시 붙어 봄 (재시도 간격이 몇 분까지 늘어나는 것을 막음)
    if ((s === 'full' || s === 'offline') && K0) autoTimer = setInterval(() => { if (!document.hidden && !paused) softRetry(); }, 30000);
    for (const fn of statusSubs) { try { fn(s); } catch (e) { /* 무시 */ } }
  }
  function armWait() {
    clearTimeout(stTimer);
    stTimer = setTimeout(() => {
      if (!paused && !connected) setStatus(navigator.onLine === false ? 'offline' : 'full');
    }, CONNECT_WAIT);
  }
  function resumeFromPause(K) {
    paused = false;
    try { K.F.goOnline(K.db); } catch (e) { /* 무시 */ }
    if (!connected) { if (status === 'ok') setStatus('connecting'); armWait(); }
  }
  function softRetry() {
    if (!K0) return;
    try { K0.F.goOffline(K0.db); K0.F.goOnline(K0.db); } catch (e) { /* 무시 */ }
    armWait();
  }

  async function boot() {
    if (status === 'idle' || status === 'offline') setStatus('connecting');
    if (!globalThis.FB) await loadScript(App.FB_SRC || 'fb.js');
    const F = globalThis.FB;
    const app = F.initializeApp(App.FIREBASE);
    let auth;
    try { auth = F.initializeAuth(app, { persistence: [F.browserLocalPersistence, F.inMemoryPersistence] }); } catch (e) { auth = F.initializeAuth(app, { persistence: F.inMemoryPersistence }); }
    const db = F.getDatabase(app);
    const emu = App.FIREBASE_EMU;
    if (emu) {
      F.connectAuthEmulator(auth, 'http://' + emu.host + ':' + emu.authPort, { disableWarnings: true });
      F.connectDatabaseEmulator(db, emu.host, emu.dbPort);
    }
    const cred = await F.signInAnonymously(auth);
    F.onValue(F.ref(db, '.info/serverTimeOffset'), (s) => { offset = Number(s.val()) || 0; });
    const K = { F, db, uid: cred.user.uid, connRef: F.ref(db, '.info/connected') };
    startOnline(K);
    return K;
  }

  // ----- 동시 접속자: online/{접속 id} 에 내 칸을 두고 개수를 셈 -----
  let count = null;
  const countSubs = new Set();
  function startOnline(K) {
    const F = K.F;
    K0 = K;
    const me = F.ref(K.db, 'online/' + rid());
    F.onValue(K.connRef, (s) => {
      connected = s.val() === true;
      if (!connected) {
        if (paused) return;
        if (status !== 'full' && status !== 'offline') setStatus('connecting');
        armWait();
        return;
      }
      clearTimeout(stTimer);
      setStatus('ok');
      F.set(me, { u: K.uid, t: F.serverTimestamp() }).then(() => F.onDisconnect(me).remove()).catch(() => {});
    });
    F.onValue(F.ref(K.db, 'online'), (snap) => {
      count = snap.exists() ? Object.keys(snap.val() || {}).length : 0;
      for (const fn of countSubs) { try { fn(count); } catch (e) { /* 무시 */ } }
    }, () => {});
    // 화면이 1분 넘게 가려져 있고 방에도 없으면 연결을 끊어 접속 자리를 비워 둠
    let hideT = null;
    document.addEventListener('visibilitychange', () => {
      clearTimeout(hideT);
      if (document.hidden) hideT = setTimeout(() => { if (live === 0) { paused = true; clearTimeout(stTimer); try { F.goOffline(K.db); } catch (e) { /* 무시 */ } } }, 60000);
      else if (paused) { resumeFromPause(K); }
    });
  }
  function kit() {
    if (!kitP) { kitP = boot(); kitP.catch(() => { kitP = null; setStatus('offline'); }); }
    return kitP;
  }
  function online(K) {
    live++; clearTimeout(offTimer);
    if (paused) resumeFromPause(K);
    else { try { K.F.goOnline(K.db); } catch (e) { /* 무시 */ } }
  }
  function offline() { live = Math.max(0, live - 1); }

  class FireRoom {
    constructor(K, name) {
      this.K = K; this.F = K.F;
      this.name = String(name).toLowerCase().replace(/[^a-z0-9-]/g, '-').slice(0, 40);
      this.me = rid();
      this.pres = {};
      this.others = [];
      this.subs = new Set(); this.errs = new Set();
      this.base = this.F.ref(K.db, 'rooms/' + this.name + '/peers');
      this.mine = this.F.ref(K.db, 'rooms/' + this.name + '/peers/' + this.me);
      this.closed = false; this.wasOff = false;
    }
    _node() { return { u: this.K.uid, p: JSON.stringify(this.pres), t: this.F.serverTimestamp() }; }
    async open() {
      const F = this.F;
      online(this.K);
      await F.set(this.mine, this._node());
      await F.onDisconnect(this.mine).remove();
      this.offPeers = F.onValue(this.base, (snap) => {
        const v = snap.val() || {};
        const list = [];
        for (const k of Object.keys(v)) {
          if (k === this.me) continue;
          let p = {};
          try { p = JSON.parse(v[k].p || '{}'); } catch (e) { /* 무시 */ }
          list.push({ peer: k, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: deepFreeze(p), updatedAt: v[k].t || 0 });
        }
        this.others = list;
        this._notify();
      }, (err) => { for (const fn of this.errs) { try { fn({ code: err.code || 'error', message: err.message }); } catch (e) { /* 무시 */ } } });
      // 잠깐 끊겼다 다시 붙으면 서버가 지운 내 칸을 다시 씀
      this.offConn = F.onValue(this.K.connRef, (s) => {
        if (this.closed) return;
        if (s.val() === true) {
          if (this.wasOff) { this.wasOff = false; F.set(this.mine, this._node()).then(() => F.onDisconnect(this.mine).remove()).catch(() => {}); }
        } else this.wasOff = true;
      });
      return this;
    }
    presence(patch) {
      const next = Object.assign({}, this.pres);
      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
      this.pres = JSON.parse(JSON.stringify(next));
      this._notify();
      if (this.closed) return Promise.resolve();
      return this.F.set(this.mine, this._node()).catch((e) => { throw { code: e.code || 'write_failed', message: e.message }; });
    }
    peers() {
      return [{ peer: this.me, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: this.pres, updatedAt: Date.now() }].concat(this.others);
    }
    _notify() { const ps = this.peers(); for (const fn of this.subs) { try { fn({ peers: ps }); } catch (e) { console.error(e); } } }
    onPeers(fn, errFn) {
      this.subs.add(fn); if (errFn) this.errs.add(errFn);
      setTimeout(() => { if (this.subs.has(fn)) fn({ peers: this.peers() }); }, 0);
      return () => { this.subs.delete(fn); if (errFn) this.errs.delete(errFn); };
    }
    connected() { return true; }
    async leave() {
      if (this.closed) return;
      this.closed = true;
      try { this.offPeers && this.offPeers(); this.offConn && this.offConn(); } catch (e) { /* 무시 */ }
      this.subs.clear(); this.errs.clear();
      try { await this.F.onDisconnect(this.mine).cancel(); } catch (e) { /* 무시 */ }
      try { await this.F.remove(this.mine); } catch (e) { /* 무시 */ }
      offline();
    }
  }

  App.fire = {
    enabled: () => !!App.FIREBASE,
    async join(name) {
      const K = await kit();
      const r = new FireRoom(K, name);
      return r.open();
    },
    now: () => Date.now() + offset,
    // 동시 접속자 수 (첫 화면 표시용). fn(n) 은 바뀔 때마다 불림
    onCount(fn) {
      countSubs.add(fn);
      if (count != null) fn(count);
      kit().catch(() => fn(null));
      return () => countSubs.delete(fn);
    },
    limit: 100,
    // 연결 상태 ('connecting' | 'ok' | 'full' | 'offline')와 안내 글
    status: () => status,
    onStatus(fn) {
      statusSubs.add(fn);
      try { fn(status); } catch (e) { /* 무시 */ }
      kit().catch(() => {});
      return () => statusSubs.delete(fn);
    },
    // o.bots === false: 컴퓨터 상대가 없는 게임(수식 신호등 1:1 등)이라 혼자 연습만 안내
    problemText(s, o) {
      s = s || status;
      const alt = o && o.bots === false ? '혼자 연습(혼자 풀기)은 그대로 할 수 있어요.' : '혼자 연습과 컴퓨터와 대결은 그대로 할 수 있어요.';
      if (s === 'offline') return '인터넷 연결이 불안정해서 온라인 서버에 연결되지 않아요. ' + alt;
      return '지금 동시 접속자가 가득 차서(최대 100명) 온라인 서버에 들어갈 수 없어요. ' + alt;
    },
    // ms 안에 서버에 연결되면 true, 아니면 false (가득 찼거나 끊긴 상태면 한 번 다시 붙어 봄)
    async ready(ms) {
      try { await kit(); } catch (e) { return false; }
      if (connected) return true;
      // 이미 가득 찬 것으로 안 뒤라면 한 번 다시 붙어 보고 짧게만 기다림
      const known = status === 'full' || status === 'offline';
      if (known) softRetry();
      if (paused && K0) resumeFromPause(K0);
      return new Promise((resolve) => {
        const fn = (st) => { if (st === 'ok') { clearTimeout(t); statusSubs.delete(fn); resolve(true); } };
        const t = setTimeout(() => { statusSubs.delete(fn); resolve(connected); }, known ? Math.min(ms || 4000, 4000) : (ms || CONNECT_WAIT + 1000));
        statusSubs.add(fn);
      });
    },
    retry: () => softRetry(),
    // 서버 응답을 ms 까지만 기다림 (가득 찬 동안은 응답이 오지 않고 멈춰 있기 때문)
    wait(p, ms) {
      let t;
      return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej({ code: 'timeout', message: '서버 응답이 없어요' }), ms || 8000); })]).finally(() => clearTimeout(t));
    },
    uid: async () => (await kit()).uid,
    // 기록 저장: results/{묶음}/{내 uid} = { n: 이름, r: 문제별 기록, at } (처음 한 번만 쓸 수 있음)
    async saveResult(key, name, r) {
      const K = await kit(), F = K.F;
      try { await F.set(F.ref(K.db, 'results/' + key + '/' + K.uid), { n: String(name).slice(0, 24), r, at: F.serverTimestamp() }); return true; } catch (e) { return false; }
    },
    async results(key) {
      const K = await kit(), F = K.F;
      const v = (await F.get(F.ref(K.db, 'results/' + key))).val() || {};
      return Object.keys(v).map((u) => ({ uid: u, me: u === K.uid, name: v[u].n, r: v[u].r, at: v[u].at }));
    },
    // 기록 대결 문제 묶음: sets/{게임-방코드} = { u, key, d: JSON(설정·시드), at } → 나중에 같은 방 코드로 온 사람이 풀 수 있게
    async putSet(name, key, d) {
      const K = await kit(), F = K.F;
      try { await F.set(F.ref(K.db, 'sets/' + name), { u: K.uid, key, d: JSON.stringify(d), at: F.serverTimestamp() }); return true; } catch (e) { return false; }
    },
    async getSet(name) {
      const K = await kit(), F = K.F;
      try {
        const v = (await F.get(F.ref(K.db, 'sets/' + name))).val();
        return v ? Object.assign({ key: v.key, at: v.at }, JSON.parse(v.d)) : null;
      } catch (e) { return null; }
    },
  };
})();

/* ---- music-songs.js ---- */
/* 배경 음악 곡 모음 (모두 이 사이트에서 새로 만든 곡). 게임을 시작할 때마다 이 중 하나를 무작위로 틂

/* ---- music.js ---- */
/* 배경 음악: 음악 파일 없이 Web Audio로 그때그때 만드는 8비트 긴장감 반복곡 (이 사이트에서 새로 만든 곡)
 *
 * - 게임이 시작되면 App.music.claim(이름), 끝나면 App.music.release(이름). 붙잡은 곳이 하나라도 있으면 재생
 * - 켜기/끄기는 App.music.button() 버튼으로. 설정은 이 브라우저에 기억
 * - 브라우저는 사용자가 한 번 누르기 전에는 소리를 막으므로, 첫 터치·클릭·키 입력 때 오디오를 깨움
 * - 남은 시간이 얼마 안 남으면 App.music.hurry(true) → 빨라지고 하이햇이 촘촘해짐
 */
(function () {
  const App = (globalThis.App = globalThis.App || {});
  const KEY = 'music.on';
  const VOL = 0.17;

  let on = true;
  try { on = App.store ? App.store.get(KEY, true) !== false : true; } catch (e) { on = true; }
  let ctx = null, master = null;
  let gestured = false, playing = false, timer = null, step = 0, nextT = 0, hurry = false, idleT = null, forceSong = null;
  // 'running'·'closed' 가 아니면 깨워야 함 (iOS 사파리는 전화·다른 앱 소리 뒤 'interrupted' 상태가 됨)

  const wake = () => { if (asleep()) ctx.resume().catch(() => {}); };
  const holders = new Set();
  const buttons = new Set();

  // ---------- 곡 연주 (곡 데이터는 music-songs.js) ----------
  const SONGS = () => App.musicSongs || [];
  let song = null, songIdx = -1;
  const freq = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const stepDurOf = (sg, fast) => 60 / (fast ? sg.hurryBpm || sg.bpm : sg.bpm) / 4;
  const stepDur = () => stepDurOf(song, hurry);

  function pulseWave(c, duty) {
    const n = 48, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) {
      re[k] = Math.sin(2 * Math.PI * k * duty) / (k * Math.PI);
      im[k] = (1 - Math.cos(2 * Math.PI * k * duty)) / (k * Math.PI);
    }
    return c.createPeriodicWave(re, im);
  }
  // 오디오 장치 하나에 필요한 것들 (실제 재생용, 미리 만들어 보기용 각각)
  function makeKit(c, out) {
    const len = Math.floor(c.sampleRate * 0.5);
    const noise = c.createBuffer(1, len, c.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return { c, out, noise, w: { p12: pulseWave(c, 0.125), p25: pulseWave(c, 0.25), p50: pulseWave(c, 0.5), tri: 'triangle' } };
