    sleepSoon();
  }
  // 소리가 다 줄어든 뒤 오디오를 재워 둠 (휴대폰 배터리). 다시 필요하면 update()/다음 터치에서 깨움
  function sleepSoon() {
    clearTimeout(idleT);
    idleT = setTimeout(() => { if (!playing && ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); }, 700);
  }

  function hidden() { try { return document.hidden; } catch (e) { return false; } }

  function update() {
    const want = on && holders.size > 0 && !hidden();
    if (want && gestured && ensureCtx()) {
      if (asleep()) { wake(); return; } // 깨어나면 onstatechange 로 다시 옴
      if (ctx.state === 'running') startLoop();
    } else {
      stopLoop();
      if (ctx && ctx.state === 'running' && !playing) sleepSoon();
    }
    if (!holders.size) hurry = false;
  }

  // 첫 터치·클릭·키 입력에서 오디오를 깨움 (브라우저 자동 재생 막기 때문)
  function unlock() {
    gestured = true;
    // 터치 안에서 깨워야 iOS 가 허락함. 지금 틀 게 없으면 update() 가 곧 다시 재움
    if (on && ensureCtx()) wake();
    update();
  }
  if (typeof document !== 'undefined') {
    for (const ev of ['pointerdown', 'touchend', 'keydown']) document.addEventListener(ev, unlock, { capture: true, passive: true });
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (hidden()) { stopLoop(); ctx.suspend().catch(() => {}); } else update();
    });
  }

  function refreshButtons() {
    for (const b of [...buttons]) {
      if (!b.isConnected) { buttons.delete(b); continue; }
      paint(b);
    }
  }
  function paint(b) {
    b.textContent = on ? '🔊 음악 켜짐' : '🔇 음악 꺼짐';
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.classList.toggle('off', !on);
  }

  App.music = {
    claim(id) { holders.add(id); update(); },
    release(id) { if (holders.delete(id)) update(); },
    hurry(v) { hurry = !!v && holders.size > 0; },
    enabled: () => on,
    playing: () => playing,
    setEnabled(v) {
      on = !!v;
      try { App.store.set(KEY, on); } catch (e) { /* 무시 */ }
      if (on) { gestured = true; if (ensureCtx()) wake(); }
      update();
      refreshButtons();
    },
    toggle() { App.music.setEnabled(!on); },
    // 점검용: 지금 곡 번호, 곡 수, 특정 곡으로 다시 시작
    current: () => (playing ? songIdx : -1),
    count: () => SONGS().length,
    _restartWith(i) { const sg = SONGS()[i]; if (!sg) return; stopLoop(); forceSong = sg; songIdx = i; update(); },
    // 점검·미리 듣기용: 곡 i 를 sec 초 동안 소리 없이 만들어 Float32Array 로 (서두르기 여부 fast)
    async _render(i, sec, fast, rate) {
      const sg = SONGS()[i];
      const OAC = globalThis.OfflineAudioContext || globalThis.webkitOfflineAudioContext;
      if (!sg || !OAC) return null;
      rate = rate || 22050;
      const c = new OAC(1, Math.ceil(rate * sec), rate);
      const g = c.createGain(); g.gain.value = VOL * (sg.gain || 1);
      const comp = c.createDynamicsCompressor();
      g.connect(comp); comp.connect(c.destination);
      const K = makeKit(c, g);
      const sd = stepDurOf(sg, fast);
      for (let k = 0, t = 0.02; t < sec; k++, t += sd) playStep(K, sg, k, t, fast);
      const buf = await c.startRendering();
      return buf.getChannelData(0);
    },
    // 켜기/끄기 버튼 (여러 화면에 있어도 모두 같이 바뀜)
    button(cls) {
      const b = App.h('button', { class: 'music-btn' + (cls ? ' ' + cls : ''), type: 'button', title: '게임 중 배경 음악 켜기/끄기', onclick: () => App.music.toggle() });
      paint(b);
      for (const x of [...buttons]) if (!x.isConnected) buttons.delete(x); // 떠난 화면의 버튼은 잡아 두지 않음
      buttons.add(b);
      return b;
    },
  };
})();

/* ---- multi.js ---- */
/* 멀티플레이: 방(room) 연결, 방장 권한 세션, 공통 로비 화면
 *
 * 연결 방식: 방 안의 각 화면은 presence(자기 상태) 하나만 씁니다.
 *  - 방장: presence.st 에 게임 전체 공개 상태를 싣습니다. (게임 규칙은 방장 화면에서만 계산)
 *  - 참가자: presence.act = {n: 순번, a: 행동} 으로 행동을 보냅니다.
 *  presence 는 보기 권한만 있는 사람도 쓸 수 있어서, 공유받은 누구나 참여할 수 있습니다.
 */
(function () {
  const App = (globalThis.App = globalThis.App || {});
  const { h } = App;

  // ---------------- 방 연결 계층 ----------------
  function rid() { return Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6); }

  function deepFreeze(o) { if (o && typeof o === 'object' && !Object.isFrozen(o)) { Object.freeze(o); for (const k in o) deepFreeze(o[k]); } return o; }

  // 같은 브라우저의 여러 탭끼리만 연결 (방 기능을 쓸 수 없는 환경에서 테스트용)
  class LocalRoom {
    constructor(name) {
      this.name = name;
      this.me = 'l' + rid();
      this.pres = {};
      this.others = new Map();
      this.subs = new Set();
      this.ch = new BroadcastChannel('bgr-room-' + name);
      this.ch.onmessage = (e) => this._recv(e.data);
      this.hb = setInterval(() => { this._send(); this._gc(); }, 900);
      this.ch.postMessage({ t: 'hello', from: this.me });
      this._send();
    }
    presence(patch) {
      const next = Object.assign({}, this.pres);
      for (const k in patch) { if (patch[k] === null) delete next[k]; else next[k] = patch[k]; }
      this.pres = JSON.parse(JSON.stringify(next));
      this._send();
      this._notify();
      return Promise.resolve();
    }
    _send() { try { this.ch.postMessage({ t: 'p', from: this.me, p: this.pres }); } catch (e) { /* 닫힘 */ } }
    _recv(m) {
      if (!m || m.from === this.me) return;
      if (m.t === 'hello') { this._send(); return; }
      if (m.t === 'bye') { this.others.delete(m.from); this._notify(); return; }
      if (m.t === 'p') {
        deepFreeze(m.p); // 실제 방 기능처럼 받은 상태는 읽기 전용
        const prev = this.others.get(m.from);
        const same = prev && JSON.stringify(prev.presence) === JSON.stringify(m.p);
        this.others.set(m.from, { presence: m.p, last: Date.now(), updatedAt: same ? prev.updatedAt : Date.now() });
        if (!same) this._notify();
      }
    }
    _gc() {
      const now = Date.now();
      let changed = false;
      for (const [k, v] of this.others) if (now - v.last > 3500) { this.others.delete(k); changed = true; }
      if (changed) this._notify();
    }
    peers() {
      const list = [{ peer: this.me, by: null, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: this.pres, updatedAt: Date.now() }];
      for (const [k, v] of this.others) list.push({ peer: k, by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: v.presence, updatedAt: v.updatedAt });
      return list;
    }
    _notify() { const ps = this.peers(); for (const fn of this.subs) { try { fn({ peers: ps }); } catch (e) { console.error(e); } } }
    onPeers(fn) { this.subs.add(fn); setTimeout(() => fn({ peers: this.peers() }), 0); return () => this.subs.delete(fn); }
    connected() { return true; }
    async leave() {
      clearInterval(this.hb);
      try { this.ch.postMessage({ t: 'bye', from: this.me }); this.ch.close(); } catch (e) { /* 무시 */ }
      this.subs.clear();
    }
  }

  const Net = (App.Net = {
    kind: null, // 'fire' | 'claude' | 'blocked' | 'local' | 'none'
    _p: null,
    init() {
      if (this._p) return this._p;
      this._p = (async () => {
        // GitHub Pages 판: Firebase 로 누구나 연결 (로그인 없이)
        if (App.fire && App.fire.enabled()) { this.kind = 'fire'; return this.kind; }
        const inClaude = !!(globalThis.claude && typeof claude.use === 'function');
        try {
          if (inClaude) {
            const room = await claude.use('room');
            if (room) { this.room = room; this.kind = 'claude'; return this.kind; }
          }
        } catch (e) { console.warn('room 사용 불가', e); }
        // 공유된 페이지인데 방 기능이 안 열림: 로그인 안 했거나, 공개 링크로만 들어온 경우.
        // 같은 브라우저 탭끼리만 되는 대체 연결로 넘어가면 친구와 연결된 것처럼 보여서 헷갈리므로 막아 둠
        if (inClaude) { this.kind = 'blocked'; return this.kind; }
        if (typeof BroadcastChannel !== 'undefined') { this.kind = 'local'; return this.kind; }
        this.kind = 'none';
        return this.kind;
      })();
      return this._p;
    },
    // 여러 기기가 같은 시각을 쓰도록 (Firebase 는 서버 시각으로 보정)
    now() { return this.kind === 'fire' && App.fire ? App.fire.now() : Date.now(); },
    online() { return this.kind === 'fire' || this.kind === 'claude' || this.kind === 'local'; },
    async join(name) {
      await this.init();
      if (this.kind === 'fire') return App.fire.join(name);
      if (this.kind === 'claude') return this.room.join(name);
      if (this.kind === 'local') return new LocalRoom(name);
      throw new Error('온라인 연결을 쓸 수 없는 환경이에요.');
    },
  });
  // 온라인 방에 못 들어오는 화면에 보여 줄 안내
  // 남은 시간 글자: 1분 넘으면 3:05, 아니면 42초
  App.leftText = (ms) => {
    const t = Math.max(0, Math.ceil(ms / 1000));
    return t > 60 ? Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') : t + '초';
  };
  App.ONLINE_BLOCKED = '이 화면에서는 온라인 방에 연결할 수 없어요. 로그인하지 않았거나, 공개 링크로만 들어온 경우예요. 친구와 같이 하려면 페이지 주인이 공유 메뉴에서 친구를 이메일로 초대하고, 친구가 초대받은 Claude 계정으로 로그인한 채 이 페이지를 열어야 해요.';

  const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
  function roomName(gameId, code) { return (gameId + '-' + code).toLowerCase().replace(/[^a-z0-9_.-]/g, ''); }
  function jsonBytes(o) { return new TextEncoder().encode(JSON.stringify(o)).length; }

  // ---------------- 세션 ----------------
  // mode: 'local'(이 기기에서 컴퓨터와) | 'host'(온라인 방장) | 'guest'(온라인 참가자)
  class Session {
    constructor({ gameId, engine, mode, nick, code, onUpdate }) {
      this.gameId = gameId;
      this.engine = engine;
      this.mode = mode;
      this.nick = App.cleanNick(nick);
      this.code = code || null;
      this.onUpdate = onUpdate || (() => {});
      this.local = {}; // 게임 화면이 기억하는 내 쪽 정보 (낸 카드, 내 비밀 수식 등)
      this.av = App.avatar ? App.avatar.mine() : null; // 내 픽셀 캐릭터 [모양, 색]
      this.status = 'connecting';
      this.error = null;
      this.seq = 0;
      this.acked = 0;
      this.closed = false;
      this.W = null; // 공개 상태 묶음
      this.G = null; // 방장만 가진 전체 게임 상태
      this.lastN = {};
      this.botDue = {};
      this.deadline = {};
      this.receivedAt = Date.now();
    }
    get isHost() { return this.mode !== 'guest'; }

    async start() {
      if (this.mode === 'local') {
        this.myPeer = 'me';
        this._initHostState();
        this.status = 'ready';
        this._startTicker();
        this._changed();
        return;
      }
      if (Net.kind === 'fire' && App.fire) {
        // 동시 접속자가 가득 차면 연결이 오류 없이 멈춰 있으므로, 잠깐만 기다리고 안내
        const ok = await App.fire.ready(10000);
        if (this.closed) return;
        if (!ok) {
          this.status = 'failed'; this.errKind = 'full';
          this.error = App.fire.problemText();
          this._changed();
          return;
        }
      }
      const p = Net.join(roomName(this.gameId, this.code));
      try {
        this.room = await (Net.kind === 'fire' && App.fire ? App.fire.wait(p, 15000) : p);
      } catch (e) {
        // 늦게라도 열리면 바로 닫아 유령 참가자·리스너가 남지 않게
        p.then((r) => { try { r.leave(); } catch (err) { /* 무시 */ } }, () => {});
        if (this.closed) return;
        this.status = 'failed';
        if (e && e.code === 'timeout' && App.fire) { this.errKind = 'full'; this.error = App.fire.problemText(); }
        else this.error = '방에 연결하지 못했어요. (' + (e && (e.code || e.message) || '알 수 없는 오류') + ')';
        this._changed();
        return;
      }
      if (this.closed) { try { this.room.leave(); } catch (e) { /* 무시 */ } return; }
      this.unsub = this.room.onPeers((ch) => this._onPeers(ch.peers || this.room.peers()), (err) => {
        this.status = 'failed';
        this.error = '연결이 끊겼어요. (' + err.code + ')';
        this._changed();
      });
      if (this.mode === 'host') {
        this.myPeer = null;
        this._initHostState();
        this.status = 'ready';
        this._startTicker();
        // 같은 코드의 방장이 이미 있는지 잠시 뒤 확인
        setTimeout(() => {
          if (this.closed) return;
          const other = this._peers().find((p) => !p.sameTab && p.presence && p.presence.h === 1 && p.presence.g === this.gameId);
          if (other) { this.status = 'failed'; this.error = '같은 코드의 방이 이미 있어요. 다시 만들어 주세요.'; this._changed(); }
        }, 1800);
      } else {
        await this.room.presence({ g: this.gameId, nick: this.nick, av: this.av, act: null });
        this.findTimer = setTimeout(() => {
          if (!this.W && !this.closed) { this.status = 'nohost'; this.error = '그 코드의 방을 찾지 못했어요. 코드를 다시 확인해 주세요. 코드가 맞다면, 방장과 내가 모두 로그인해 있고 페이지 주인에게 초대받은 계정인지 확인해 주세요.'; this._changed(); }
        }, 6000);
      }
      this._changed();
    }

    _peers() { try { return this.room ? this.room.peers() : []; } catch (e) { return []; } }

    _initHostState() {
      const e = this.engine;
      this.W = {
        g: this.gameId, ph: 'lobby', v: 0,
        pl: [{ p: this.myPeer || 'host', n: this.nick, b: 0, on: 1, tm: 0, a: this.av }],
        o: Object.assign({}, e.defaultOpts || {}),
        s: null, ak: [], er: null, dl: [], res: null,
      };
      if (this.mode === 'local' && e.allowBots) {
        const want = Math.max(e.minPlayers, Math.min(e.maxPlayers, e.defaultBots || e.minPlayers)) - 1;
        for (let i = 0; i < want; i++) this.addBot(true);
      }
    }

    // ---- 방장 쪽 처리 ----
    _onPeers(peers) {
      if (this.closed) return;
      const me = peers.find((p) => p.sameTab);
      if (me && !this.myPeer) {
        this.myPeer = me.peer;
        if (this.mode === 'host') this.W.pl[0].p = me.peer;
      }
      if (this.mode === 'host') this._hostPeers(peers);
      else this._guestPeers(peers);
    }

    _hostPeers(peers) {
      const W = this.W;
      let changed = false;
      const present = new Map();
      for (const p of peers) if (!p.sameTab && p.presence && p.presence.g === this.gameId && p.presence.h !== 1) present.set(p.peer, p);

      if (W.ph === 'lobby') {
        // 나간 사람 빼기
        const before = W.pl.length;
        W.pl = W.pl.filter((x, i) => i === 0 || x.b || present.has(x.p));
        if (W.pl.length !== before) changed = true;
        // 새로 온 사람 넣기
        for (const [peer, p] of present) {
          const av = App.avatar && App.avatar.valid(p.presence.av) ? p.presence.av.slice() : null;
          const x = W.pl.find((q) => q.p === peer);
          if (!x && W.pl.length < this.engine.maxPlayers) {
            W.pl.push({ p: peer, n: App.cleanNick(p.presence.nick), b: 0, on: 1, tm: this._nextTeam(), a: av || this._randomAv() });
            changed = true;
          } else if (x && av && (!x.a || x.a[0] !== av[0] || x.a[1] !== av[1])) { x.a = av; changed = true; } // 로비에서 캐릭터를 바꿈
        }
      } else {
        // 게임 중: 연결 상태 갱신 (끊기면 컴퓨터가 대신 둡니다)
        W.pl.forEach((x, i) => {
          if (i === 0 || x.b) return;
          const on = present.has(x.p) ? 1 : 0;
          if (x.on !== on) { x.on = on; changed = true; }
        });
        // 행동 처리
        for (const [peer, p] of present) {
          const seat = W.pl.findIndex((x) => x.p === peer);
          const act = p.presence.act;
          if (seat < 0 || !act || typeof act.n !== 'number') continue;
          if (act.n <= (this.lastN[peer] || 0)) continue;
          this.lastN[peer] = act.n;
          this._setAck(peer, act.n);
          if (W.ph === 'play') this._apply(seat, act.a, peer, act.n);
          changed = true;
        }
      }
      if (changed) this._publish();
    }

    _setAck(pid, n) {
      const W = this.W;
      const i = W.ak.findIndex((x) => x[0] === pid);
      if (i >= 0) W.ak[i][1] = n; else W.ak.push([pid, n]);
    }

    _apply(seat, a, pid, n) {
      try {
        this.engine.act(this.G, seat, a);
        this.W.er = null;
      } catch (e) {
        this.W.er = [pid || this.W.pl[seat].p, n || 0, String(e && e.message || e).slice(0, 120)];
        if (seat === 0) App.toast(this.W.er[2], 'warn');
        return false;
      }
      this._afterChange();
      return true;
    }

    _afterChange() {
      const e = this.engine, W = this.W;
      W.s = e.publicView(this.G);
      if (e.over(this.G)) {
        W.ph = 'end';
        W.res = e.results ? e.results(this.G) : null;
        // 유배지 한 명은 방장 화면에서 한 번만 정해서 모두에게 같은 결과를 보냄
        if (W.res && Array.isArray(W.res.scores) && W.res.exile === undefined && !W.res.places) {
          const [ex, how] = pickExile(W.res.scores, W.res.tb);
          W.res.exile = ex;
          W.res.exileHow = how;
        }
      }
    }

    _startTicker() {
      this.ticker = setInterval(() => this._tick(), 250);
    }

    _tick() {
      if (this.closed || !this.W || this.W.ph !== 'play') return;
      const e = this.engine, now = Date.now();
      let changed = false;
      if (e.tick && e.tick(this.G, now)) { this._afterChange(); changed = true; if (this.W.ph !== 'play') { this._publish(); return; } }
      // 단계가 바뀌면(새 라운드, 다음 차례 등) 제한 시간을 새로 잼
      const G = this.G;
      const dk = [G.ph, G.round, G.turn, G.cur, G.k, G.half, G.gstep, G.moves, G.pi].join('|');
      if (dk !== this.dlKey) { this.dlKey = dk; if (Object.keys(this.deadline).length) changed = true; this.deadline = {}; this.botDue = {}; }
      const pend = e.pending(this.G);
      for (const s of Object.keys(this.deadline)) if (!pend.includes(+s)) { delete this.deadline[s]; changed = true; }
      for (const s of Object.keys(this.botDue)) if (!pend.includes(+s)) delete this.botDue[s];
      for (const seat of pend) {
        const pl = this.W.pl[seat];
        const auto = pl.b || !pl.on;
        if (auto) {
          if (!this.botDue[seat]) this.botDue[seat] = now + (e.botDelay ? e.botDelay(this.G, seat) : 500 + Math.random() * 900);
          if (now >= this.botDue[seat]) {
            delete this.botDue[seat];
            const a = e.bot(this.G, seat);
            if (a) { this._apply(seat, a); changed = true; }
            break; // 한 번에 하나씩
          }
        } else {
          const lim = this.mode !== 'local' && e.timeLimit ? e.timeLimit(this.G, seat) : 0;
          if (!lim) continue;
          if (!this.deadline[seat]) { this.deadline[seat] = now + lim; changed = true; }
          if (now >= this.deadline[seat]) {
            delete this.deadline[seat];
            const a = (e.timeout || e.bot)(this.G, seat);
            if (a) { this._apply(seat, a); changed = true; }
            break;
          }
        }
      }
      if (changed) this._publish();
    }

    _publish() {
      const W = this.W;
      W.v++;
      const now = Date.now();
      W.dl = Object.keys(this.deadline).map((s) => [+s, Math.max(0, this.deadline[s] - now)]);
      this.receivedAt = now;
      if (this.mode === 'host' && this.room) {
        const msg = { h: 1, g: this.gameId, nick: this.nick, st: W };
        const size = jsonBytes(msg);
        if (size > 4000) console.warn('상태가 너무 큽니다', size);
        this.room.presence(msg).catch((err) => console.warn('presence 실패', err));
      }
      this._changed();
    }

    // ---- 참가자 쪽 처리 ----
    _guestPeers(peers) {
      const host = peers.find((p) => !p.sameTab && p.presence && p.presence.h === 1 && p.presence.g === this.gameId && p.presence.st);
      if (!host) {
        if (this.W && this.status === 'ready') { this.status = 'hostleft'; this.error = '방장이 방을 나갔어요.'; this._changed(); }
        return;
      }
      const W = host.presence.st;
      if (this.W && W.v === this.W.v && this.status === 'ready') return;
      clearTimeout(this.findTimer);
      this.W = W;
      this.receivedAt = Date.now();
      this.status = 'ready';
      this.error = null;
      const ak = (W.ak || []).find((x) => x[0] === this.myPeer);
      if (ak) this.acked = Math.max(this.acked, ak[1]);
      if (W.er && W.er[0] === this.myPeer && W.er[1] === this.seq && this._lastErr !== W.er[1]) {
        this._lastErr = W.er[1];
        App.toast(W.er[2], 'warn');
      }
      this._changed();
    }

    // ---- 공통 ----
    get mySeat() {
      if (!this.W) return -1;
      if (this.isHost) return 0;
      return this.W.pl.findIndex((x) => x.p === this.myPeer);
    }
    get waiting() { return this.mode === 'guest' && this.seq > this.acked; }

    send(a) {
      if (this.isHost) {
        if (this.W.ph !== 'play') return false;
        const ok = this._apply(0, a);
        this._publish();
        return ok;
      }
      this.seq++;
      this.room.presence({ act: { n: this.seq, a } }).catch((err) => App.toast('보내지 못했어요: ' + err.code, 'warn'));
      this._changed();
      return true;
    }

    remaining(seat) {
      if (!this.W || !this.W.dl) return null;
      const d = this.W.dl.find((x) => x[0] === seat);
      if (!d) return null;
      return Math.max(0, d[1] - (Date.now() - this.receivedAt));
    }

    // 방장 전용 조작
    addBot(silent) {
      const W = this.W, e = this.engine;
      if (!this.isHost || W.ph !== 'lobby' || !e.allowBots || W.pl.length >= e.maxPlayers) return;
      const names = e.botNames || ['컴퓨터 A', '컴퓨터 B', '컴퓨터 C', '컴퓨터 D', '컴퓨터 E', '컴퓨터 F', '컴퓨터 G'];
      const used = new Set(W.pl.map((x) => x.n));
      const n = names.find((x) => !used.has(x)) || '컴퓨터';
      W.pl.push({ p: 'bot' + rid().slice(0, 6), n, b: 1, on: 1, tm: this._nextTeam(), a: this._randomAv() });
      if (!silent) this._publish();
    }
    // 방 안의 다른 캐릭터와 겹치지 않게 무작위
    _randomAv() { return App.avatar ? App.avatar.random(this.W.pl.map((x) => x.a)) : null; }
    // 내 캐릭터 바꾸기 (로비에서): 방장·혼자면 바로 반영, 참가자면 방장에게 알림
    setMyAvatar(a) {
      if (!App.avatar || !App.avatar.valid(a)) return;
      this.av = a.slice();
      const W = this.W;
      if (this.isHost) {
        if (W && W.ph === 'lobby' && W.pl[0]) { W.pl[0].a = a.slice(); this._publish(); }
      } else if (this.room) {
        this.room.presence({ av: a.slice() }).catch(() => {});
      }
    }
    // 팀전: 인원이 적은 팀으로 넣음
    _nextTeam() { const c = [0, 0]; for (const x of this.W.pl) c[x.tm ? 1 : 0]++; return c[0] <= c[1] ? 0 : 1; }
    setSeatProp(i, k, v) {
      const W = this.W;
      if (!this.isHost || W.ph !== 'lobby' || !W.pl[i]) return;
      W.pl[i][k] = v;
      this._publish();
    }
    autoTeams() {
      const W = this.W;
      if (!this.isHost || W.ph !== 'lobby') return;
      const idx = W.pl.map((_, i) => i);
      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      idx.forEach((seat, k) => { W.pl[seat].tm = k % 2; });
      this._publish();
    }
    removeSeat(i) {
      const W = this.W;
      if (!this.isHost || W.ph !== 'lobby' || i === 0) return;
      W.pl.splice(i, 1);
      this._publish();
    }
    setOpt(k, v) {
      if (!this.isHost || this.W.ph !== 'lobby') return;
      this.W.o[k] = v;
      this._publish();
    }
    startGame() {
      const W = this.W, e = this.engine;
      if (!this.isHost) return;
      if (W.pl.length < e.minPlayers) { App.toast('최소 ' + e.minPlayers + '명이 필요해요.', 'warn'); return; }
      if (e.canStart) { const why = e.canStart(W); if (why) { App.toast(why, 'warn'); return; } }
      this.G = e.start(W.pl.map((x) => ({ n: x.n, b: !!x.b, tm: x.tm ? 1 : 0 })), W.o, { code: this.mode === 'local' ? null : this.code, gameId: this.gameId });
      W.ph = 'play';
      W.gn = (W.gn || 0) + 1;
      W.res = null;
      W.er = null;
      this.deadline = {};
      this.botDue = {};
      this._afterChange();
      this._publish();
    }
    backToLobby() {
      if (!this.isHost) return;
      this.W.ph = 'lobby';
      this.W.s = null;
      this.W.res = null;
      this.G = null;
      // 연결이 끊긴 사람은 정리
      this.W.pl = this.W.pl.filter((x, i) => i === 0 || x.b || x.on);
      this._publish();
    }

    _changed() { if (!this.closed) { try { this.onUpdate(this); } catch (e) { console.error(e); } } }

    close() {
      this.closed = true;
      clearInterval(this.ticker);
      clearTimeout(this.findTimer);
      try { this.unsub && this.unsub(); } catch (e) { /* 무시 */ }
      try { this.room && this.room.leave && this.room.leave(); } catch (e) { /* 무시 */ }
    }
  }
  App.Session = Session;

  // ---------------- 게임 후 숙소 배정 안내 ----------------
  // 꼴찌(동점이면 함께) → 유배지, 나머지 중 위쪽 절반(인원의 절반 내림, 같은 점수는 함께) → 생활동, 그 밖 → 감옥동
  // 모두 같은 점수(무승부)면 모두 생활동
  const PLACES = { live: ['생활동', '생활동으로'], prison: ['감옥동', '감옥동으로'], exile: ['유배지', '유배지로'] };
  // 유배지로 갈 꼴찌 한 명 고르기 (방장 화면에서 한 번만): 동점이면 보조 점수(tb, 높을수록 좋음)로, 그래도 같으면 추첨
  function pickExile(scores, tb) {
    const low = Math.min(...scores), high = Math.max(...scores);
    if (low === high) return [-1, ''];
    let cand = scores.map((v, i) => (v === low ? i : -1)).filter((i) => i >= 0);
    let how = '';
    if (cand.length > 1 && Array.isArray(tb)) {
      const m = Math.min(...cand.map((i) => tb[i]));
      const c2 = cand.filter((i) => tb[i] === m);
      if (c2.length < cand.length) how = 'tb';
      cand = c2;
    }
    if (cand.length > 1) { how = 'lot'; cand = [cand[Math.floor(Math.random() * cand.length)]]; }
    return [cand[0], how];
  }
  function assignPlaces(scores, exile) {
    const n = scores.length;
    const out = Array(n).fill('prison');
    const low = Math.min(...scores), high = Math.max(...scores);
    if (low === high) return out.fill('live');
    if (exile == null || exile < 0) exile = scores.indexOf(low);
    const order = [...Array(n).keys()].sort((a, b) => scores[b] - scores[a]);
    const liveCount = Math.max(1, Math.floor(n / 2));
    order.forEach((seat) => {
      if (seat === exile) out[seat] = 'exile';
      else if (scores[seat] === low) out[seat] = 'prison';
      else {
        // 같은 점수 묶음이 생활동 경계에 걸치면 묶음 전체를 생활동으로
        const firstIdx = order.findIndex((x) => scores[x] === scores[seat]);
        out[seat] = firstIdx < liveCount ? 'live' : 'prison';
      }
    });
    return out;
  }
  App.assignPlaces = assignPlaces;

  function announcement(W, mySeat) {
    const scores = W.res && Array.isArray(W.res.scores) ? W.res.scores : null;
    if (!scores || scores.length !== W.pl.length || W.pl.length < 2) return null;
    const places = Array.isArray(W.res.places) ? W.res.places : assignPlaces(scores, W.res.exile);
    const order = [...W.pl.keys()].sort((a, b) => ({ live: 0, prison: 1, exile: 2 })[places[a]] - ({ live: 0, prison: 1, exile: 2 })[places[b]]);
    return h('section', { class: 'announce', 'aria-label': '숙소 배정 안내' },
      h('p', { class: 'announce-head' }, '📢 안내 방송'),
      h('ul', { class: 'announce-list' }, order.map((i) => h('li', { class: 'ann ' + places[i] + (i === mySeat ? ' me' : '') },
        h('span', { class: 'ann-tag' }, PLACES[places[i]][0]),
        App.avatar ? App.avatar.seat(W, i) : null,
        h('span', null, h('b', null, W.pl[i].n), '님은 지금 바로 ', h('b', { class: 'ann-place' }, PLACES[places[i]][1]), ' 이동해주시기 바랍니다.')))),
      W.res.exileHow === 'lot' ? h('p', { class: 'note' }, '꼴찌가 동점이라 추첨으로 유배지 한 명을 정했어요.')
        : W.res.exileHow === 'tb' ? h('p', { class: 'note' }, '꼴찌가 동점이라 오답이 더 많은 사람이 유배지로 가요.') : null);
  }

  // ---------------- 공통 로비 화면 ----------------
  // cfg: { gameId, engine, renderGame(el, session), renderOptions(el, session, disabled), soloLabel }
  App.multi = {
    mount(root, ctx, cfg) {
      let session = null;
      let finishedFor = -1;
      const view = h('div', { class: 'mp' });
      root.append(view);
      const tune = 'multi:' + cfg.gameId + ':' + Math.random().toString(36).slice(2, 8); // 배경 음악을 붙잡는 이름
      const music = (play) => { if (App.music) { if (play) App.music.claim(tune); else { App.music.hurry(false); App.music.release(tune); } } };
      let offSt = null; // 고르기 화면의 연결 상태 구독
      const unsubStatus = () => { if (offSt) { offSt(); offSt = null; } };
      // 게임 화면이 따로 만든 것(문제 묶음, 늦게 온 사람 화면 등)을 정리
      function dispose(s) {
        if (!s || s._disposed) return;
        s._disposed = true;
        if (s._lateStop) { try { s._lateStop(); } catch (e) { console.error(e); } s._lateStop = null; }
        if (cfg.dispose) { try { cfg.dispose(s); } catch (e) { console.error(e); } }
      }

      function leave() {
        dispose(session);
        if (session) session.close();
        session = null;
        finishedFor = -1;
        music(false);
        renderChooser();
      }

      function startSession(mode, code) {
        unsubStatus();
        const nick = App.cleanNick(App.store.get('nick', ''));
        session = new Session({
          gameId: cfg.gameId, engine: cfg.engine, mode, nick, code,
          onUpdate: (s) => render(s),
        });
        session.start();
        render(session);
        // 새 화면(방)으로 바뀐 걸 바로 볼 수 있게 맨 위로
        try { view.scrollIntoView({ block: 'start' }); } catch (e) { /* 무시 */ }
      }

      function renderChooser() {
        unsubStatus();
        App.clear(view);
        const nickInput = h('input', { id: cfg.gameId + '-nick', class: 'input', maxlength: '12', placeholder: '닉네임', value: App.store.get('nick', '') });
        nickInput.addEventListener('input', () => App.store.set('nick', nickInput.value));
        const codeInput = h('input', { id: cfg.gameId + '-code', class: 'input code-input', maxlength: '4', placeholder: '코드 4자리', autocapitalize: 'characters', autocomplete: 'off' });
        codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
        const onlineNote = h('p', { class: 'note' }, '온라인 연결 상태를 확인하는 중…');
        const btnHost = h('button', { class: 'btn', disabled: true, onclick: () => { if (!nickInput.value.trim()) nickInput.value = App.cleanNick(''); App.store.set('nick', nickInput.value); startSession('host', newCode()); } }, '온라인 방 만들기');
        const btnJoin = h('button', { class: 'btn', disabled: true, onclick: () => {
          const c = codeInput.value.trim();
          if (c.length !== 4) { App.toast('방 코드 4자리를 입력해 주세요.', 'warn'); codeInput.focus(); return; }
          App.store.set('nick', nickInput.value);
          startSession('guest', c);
        } }, '참가하기');
        codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') btnJoin.click(); });

        const e = cfg.engine;
        const soloCard = e.allowBots ? h('div', { class: 'mode-card' },
          h('h4', null, cfg.soloLabel || '컴퓨터와 하기'),
          h('p', null, '이 기기에서 컴퓨터 플레이어와 바로 시작합니다.'),
          h('button', { class: 'btn primary', onclick: () => { App.store.set('nick', nickInput.value); startSession('local'); } }, '바로 시작')) : null;

        let avBox = null;
        if (App.avatar) {
          // 내 캐릭터: 평소엔 한 줄로, 「바꾸기」를 누르면 고르기 판 (판 안에 닫기)
          avBox = h('div', { class: 'av-mine' });
          let open = false;
          const paintAv = () => {
            App.clear(avBox);
            const a = App.avatar.mine();
            if (open) { avBox.append(App.avatar.picker(a, null, { compact: true, onClose: () => { open = false; paintAv(); } })); return; }
            avBox.append(h('div', { class: 'av-mine-row' },
              h('span', { class: 'av-chip big' }, App.avatar.svg(a, 32, '내 캐릭터: ' + App.avatar.nameOf(a))),
              h('span', { class: 'av-mine-text' }, h('span', { class: 'note' }, '내 캐릭터'), h('b', null, App.avatar.nameOf(a))),
              h('button', { class: 'btn tiny', type: 'button', onclick: () => { open = true; paintAv(); } }, '바꾸기')));
          };
          paintAv();
        }
        view.append(
          h('div', { class: 'mp-choose' },
            h('label', { class: 'field', for: cfg.gameId + '-nick' }, h('span', null, '내 닉네임'), nickInput),
            avBox,
            h('div', { class: 'mode-grid' },
              soloCard,
              h('div', { class: 'mode-card' },
                h('h4', null, '친구와 온라인'),
                h('p', null, '방을 만들고 코드를 알려주면, 같은 페이지를 연 친구가 들어올 수 있어요. 빈자리는 컴퓨터로 채울 수 있어요.'),
                btnHost,
                h('div', { class: 'join-row' }, codeInput, btnJoin)),
            ),
            onlineNote,
          ),
        );
        Net.init().then((kind) => {
          if (kind === 'fire') {
            btnHost.disabled = false; btnJoin.disabled = false;
            const paint = (st) => {
              const bad = st === 'full' || st === 'offline';
              onlineNote.textContent = bad ? App.fire.problemText(st, { bots: !!cfg.engine.allowBots }) : '방을 만들고 코드를 알려 주면, 이 페이지를 연 친구가 로그인 없이 들어올 수 있어요.';
              onlineNote.classList.toggle('warn-note', bad);
            };
            if (onlineNote.isConnected) { unsubStatus(); offSt = App.fire.onStatus(paint); }
          }
          else if (kind === 'claude') { btnHost.disabled = false; btnJoin.disabled = false; onlineNote.textContent = '온라인 방에 연결할 수 있어요. 친구는 공유 메뉴에서 이메일로 초대받은 Claude 계정으로 로그인해서 이 페이지를 열어야 같은 방 코드로 들어올 수 있어요.'; }
          else if (kind === 'blocked') { onlineNote.textContent = App.ONLINE_BLOCKED; onlineNote.classList.add('warn-note'); }
          else if (kind === 'local') { btnHost.disabled = false; btnJoin.disabled = false; onlineNote.textContent = '지금은 이 브라우저 안의 다른 탭끼리만 연결돼요. 공유된 페이지에서 열면 친구와 연결됩니다.'; }
          else { onlineNote.textContent = '이 환경에서는 온라인 연결을 쓸 수 없어요.'; }
        });
      }

      // 자리 칸: P1(방장)부터 최대 인원까지. 들어오면 칸이 채워지고, 새로 들어온 칸은 반짝
      function seatGrid(s) {
        const W = s.W, e = cfg.engine;
        const prev = s._seatSeen || null;
        const ids = W.pl.map((p) => p.p);
        const fresh = new Set(prev ? ids.filter((x, i) => i > 0 && !prev.ids.includes(x)) : []);
        if (prev && W.ph === 'lobby' && s.mode !== 'local') {
          // 알림은 화면을 다 그린 뒤에 (그리는 도중 띄우면 화면이 잠깐 비어 맨 위로 튀어 오름)
          const later = (t) => setTimeout(() => App.toast(t), 0);
          W.pl.forEach((p, i) => { if (fresh.has(p.p) && !p.b && i !== s.mySeat) later('🙋 ' + p.n + '님이 들어왔어요'); });
          prev.pl.forEach(([pid, n, b], i) => { if (i > 0 && !b && !ids.includes(pid)) later(n + '님이 나갔어요'); });
        }
        s._seatSeen = { ids, pl: W.pl.map((p) => [p.p, p.n, p.b]) };
        const tag = (t, c) => h('span', { class: 'chip-tag' + (c ? ' ' + c : '') }, t);
        const firstEmpty = W.pl.length;
        const cells = [];
        for (let i = 0; i < e.maxPlayers; i++) {
          const p = W.pl[i];
          if (p) {
            cells.push(h('li', { class: 'seat' + (i === s.mySeat ? ' me' : '') + (fresh.has(p.p) ? ' pop' : ''), style: { '--pc': `var(--p${i % 7})` } },
              h('span', { class: 'seat-no' }, 'P' + (i + 1)),
              h('span', { class: 'seat-face' + (App.avatar && App.avatar.valid(p.a) ? ' av' : ''), 'aria-hidden': 'true' }, App.avatar && App.avatar.valid(p.a) ? App.avatar.svg(p.a, 48) : (p.b ? '🤖' : (Array.from(p.n)[0] || '?'))),
              h('span', { class: 'seat-name' }, p.n),
              h('span', { class: 'seat-tags' },
                i === 0 && s.mode !== 'local' ? tag('방장') : null,
                i === s.mySeat ? tag('나') : null,
                p.b ? tag('컴퓨터') : null,
                !p.on ? tag('연결 끊김', 'warn') : null),
              cfg.seatExtra ? cfg.seatExtra(s, i, p) : null,
              i === s.mySeat && W.ph === 'lobby' && App.avatar ? h('button', { class: 'btn tiny ghost av-change', 'aria-expanded': s._avOpen ? 'true' : 'false', onclick: () => { s._avOpen = !s._avOpen; render(s); } }, s._avOpen ? '닫기' : '캐릭터 바꾸기') : null,
              s.isHost && i !== 0 && W.ph === 'lobby' ? h('button', { class: 'btn tiny ghost seat-x', onclick: () => s.removeSeat(i), 'aria-label': p.n + ' 빼기' }, '빼기') : null));
          } else {
            cells.push(h('li', { class: 'seat empty' },
              h('span', { class: 'seat-no' }, 'P' + (i + 1)),
              h('span', { class: 'seat-face', 'aria-hidden': 'true' }, '?'),
              h('span', { class: 'seat-wait' }, s.mode === 'local' ? '빈자리' : '기다리는 중', s.mode === 'local' ? null : h('span', { class: 'dots' }, '…')),
              s.isHost && e.allowBots && i === firstEmpty ? h('button', { class: 'btn tiny', onclick: () => s.addBot() }, '+ 컴퓨터') : null));
          }
        }
        return h('ol', { class: 'seats', 'aria-label': '자리' }, cells);
      }

      function render(s) {
        if (s !== session) return;
        music(!!(s.W && s.W.ph === 'play' && s.status !== 'failed' && s.status !== 'hostleft'));
        App.clear(view);
        if (s.status === 'connecting') { view.append(h('div', { class: 'center-msg' }, '방에 연결하는 중…')); return; }
        if (s.status === 'nohost' && cfg.lateJoin) {
          const box = h('div', { class: 'center-msg' }, h('p', null, '방을 찾는 중…'));
          view.append(box);
          if (!s._late) s._late = cfg.lateJoin(s.code);
          s._late.then((el) => {
            if (session !== s || !box.isConnected) return;
            App.clear(box);
            if (el) { const node = el(leave); s._lateStop = node._stop || null; box.replaceWith(node); }
            else box.append(h('p', null, s.error), h('button', { class: 'btn', onclick: leave }, '처음으로'));
          });
          return;
        }
        if (s.status === 'failed' || s.status === 'hostleft' || (s.status === 'nohost' && !cfg.lateJoin)) dispose(s);
        if (s.status === 'failed' && s.errKind === 'full') {
          const again = () => { const m = s.mode, c = s.mode === 'host' ? newCode() : s.code; leave(); startSession(m, c); };
          const local = () => { leave(); startSession('local'); };
          view.append(h('div', { class: 'center-msg full-msg' },
            h('p', { class: 'note warn-note' }, App.fire ? App.fire.problemText(null, { bots: !!cfg.engine.allowBots }) : s.error),
            h('div', { class: 'row wrap center' },
              cfg.engine.allowBots ? h('button', { class: 'btn primary', onclick: local }, cfg.soloLabel || '컴퓨터와 하기') : null,
              h('button', { class: 'btn', onclick: again }, '다시 시도'),
              h('button', { class: 'btn ghost', onclick: leave }, '처음으로'))));
          return;
        }
        if (s.status === 'failed' || s.status === 'nohost' || s.status === 'hostleft') {
          view.append(h('div', { class: 'center-msg' }, h('p', null, s.error || '연결에 문제가 생겼어요.'), h('button', { class: 'btn', onclick: leave }, '처음으로')));
          return;
        }
        const W = s.W, e = cfg.engine;
        const bar = h('div', { class: 'mp-bar' },
          s.mode === 'local' ? h('span', { class: 'bar-label' }, '컴퓨터와 대전') : h('span', { class: 'bar-label' }, '방 코드 ', h('b', { class: 'code' }, s.code)),
          h('span', { class: 'spacer' }),
          h('button', { class: 'btn tiny ghost', onclick: leave }, '나가기'));
        view.append(bar);

        if (W.ph === 'lobby') {
          const box = h('div', { class: 'lobby' });
          if (s.mode !== 'local') {
            const copy = () => {
              const t = s.code;
              try { navigator.clipboard.writeText(t).then(() => App.toast('방 코드를 복사했어요.'), () => App.toast('방 코드: ' + t)); } catch (err) { App.toast('방 코드: ' + t); }
            };
            const first = !s._madeShown;
            s._madeShown = true;
            box.append(h('section', { class: 'room-made' + (first ? ' pop' : '') },
              h('p', { class: 'room-made-head' }, s.isHost ? '✅ 방이 만들어졌어요!' : s.mySeat >= 0 ? '✅ 방에 들어왔어요!' : '👀 자리가 다 차서 관전 중이에요'),
              h('p', { class: 'room-made-sub' }, '방 코드'),
              h('div', { class: 'code-tiles big', 'aria-label': '방 코드 ' + s.code, 'data-code': s.code }, s.code.split('').map((c) => h('b', { 'aria-hidden': 'true' }, c))),
              h('button', { class: 'btn tiny', onclick: copy }, '코드 복사'),
              h('p', { class: 'note' }, s.isHost
                ? '친구가 같은 게임의 「참가하기」에 이 코드를 넣으면 아래 빈자리가 하나씩 채워져요.'
                : '방장이 「게임 시작」을 누르면 바로 시작돼요.')));
          }
          box.append(h('h4', { class: 'sub lobby-head' }, h('span', null, s.mode === 'local' ? '참가자' : '자리'), h('span', { class: 'mono' }, W.pl.length + ' / ' + e.maxPlayers)), seatGrid(s));
          if (s._avOpen && App.avatar && s.mySeat >= 0) {
            const cur = W.pl[s.mySeat] && W.pl[s.mySeat].a;
            box.append(h('div', { class: 'av-lobby' }, App.avatar.picker(cur || s.av, (a) => s.setMyAvatar(a), { compact: true, onClose: () => { s._avOpen = false; render(s); } })));
          }
          if (s.isHost) {
            if (cfg.renderOptions) { const o = h('div', { class: 'opts' }); cfg.renderOptions(o, s, false); box.append(o); }
            const ok = W.pl.length >= e.minPlayers;
            box.append(h('button', { class: 'btn primary big lobby-start', disabled: !ok, onclick: () => s.startGame() }, ok ? '게임 시작' : ('최소 ' + e.minPlayers + '명 필요')));
            if (s.mode === 'host' && e.allowBots) box.append(h('p', { class: 'note' }, '친구가 다 안 모이면 빈자리를 「+ 컴퓨터」로 채워도 돼요.'));
          } else {
            if (cfg.renderOptions) { const o = h('div', { class: 'opts' }); cfg.renderOptions(o, s, true); box.append(o); }
          }
          view.append(box);
          return;
        }

        // 게임 중 / 종료
        const gameEl = h('div', { class: 'game-area' });
        view.append(gameEl);
        cfg.renderGame(gameEl, s);
        if (W.ph === 'end') {
          const ann = announcement(W, s.mySeat);
          if (ann) view.append(ann);
          if (finishedFor !== W.gn && s.mySeat >= 0) {
            finishedFor = W.gn;
            ctx.finished(cfg.finishInfo ? cfg.finishInfo(s) : null);
          }
          const endCtl = h('div', { class: 'row wrap end-ctl' });
          if (s.isHost) {
            endCtl.append(h('button', { class: 'btn primary', onclick: () => s.startGame() }, '같은 멤버로 다시'), h('button', { class: 'btn', onclick: () => s.backToLobby() }, s.mode === 'local' ? '설정 바꾸기' : '로비로'));
          } else endCtl.append(h('span', { class: 'note' }, '방장이 다음 판을 시작할 때까지 기다려 주세요.'));
          view.append(endCtl);
        }
      }

      // 남은 시간 표시 갱신
      const clock = setInterval(() => {
        if (!session || !session.W || session.W.ph !== 'play') return;
        view.querySelectorAll('[data-until]').forEach((el) => {
          const r = +el.dataset.until - Date.now();
          el.textContent = App.leftText(r);
        });
        view.querySelectorAll('[data-timer-seat]').forEach((el) => {
          const r = session.remaining(+el.dataset.timerSeat);
          el.textContent = r == null ? '' : App.leftText(r);
        });
        if (App.music) {
          // 내 차례 제한 시간(또는 data-hurry 표시가 붙은 단계 시간)이 15초 안쪽이면 빨라지게
          const me = session.mySeat;
          let left = me >= 0 ? session.remaining(me) : null;
          view.querySelectorAll('[data-hurry][data-until]').forEach((el) => { const r = +el.dataset.until - Date.now(); if (left == null || r < left) left = r; });
          App.music.hurry(left != null && left > 0 && left < 15000);
        }
      }, 300);

      renderChooser();
      return () => { clearInterval(clock); unsubStatus(); music(false); dispose(session); if (session) session.close(); };
    },
  };
})();

/* ---- quick.js ---- */
/* 빨리 풀기 게임 공용 틀: 시드 난수, 혼자 연습(5문제), 오늘의 문제(전체 순위), 온라인 대결(빨리 맞히기·팀전 / 기록 대결) */
(function () {
  const App = (globalThis.App = globalThis.App || {});
  const { h } = App;

  // ---------- 시드 난수 (같은 시드 = 모든 화면에 같은 문제) ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function srng(seed) {
    const f = mulberry32(seed >>> 0);
    return {
      f,
      int(a, b) { return a + Math.floor(f() * (b - a + 1)); },
      float(a, b) { return a + f() * (b - a); },
      pick(arr) { return arr[Math.floor(f() * arr.length)]; },
      chance(p) { return f() < p; },
      shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    };
  }
  App.srng = srng;
  const newSeed = () => (Math.random() * 2147483647) | 0;

  const RACE_LOCK = 20000;   // 온라인: 틀리면 20초 잠금
  const SOLO_LOCK = 5000;    // 혼자: 틀리면 5초 잠금
  const REVEAL_MS = 7000;    // 라운드 결과를 보여주는 시간
  const ROUND_MS = 240000;   // 한 라운드 최대 시간

  // 문제 만들기 결과 기억 (방장·참가자가 같은 시드로 같은 문제를 만듦)
  const cache = new Map();
  function puzzleOf(def, seed, opts) {
    const key = def.id + ':' + seed + ':' + JSON.stringify(opts || {});
    if (!cache.has(key)) {
      if (cache.size > 40) cache.clear();
      cache.set(key, def.gen(seed, opts || {}));
    }
    return cache.get(key);
  }

  // ---------- 온라인 대결 규칙: 빨리 맞히기(개인전·팀전) / 기록 대결 ----------
  const TEAMS = ['A팀', 'B팀'];
  const netNow = () => (App.Net && App.Net.now ? App.Net.now() : Date.now());
  function seedsFrom(seed, n) { const r = srng((seed ^ 0x5bd1e995) >>> 0); return Array.from({ length: n }, () => Math.floor(r.f() * 2147483647)); }
  const clampInt = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.floor(Number(v) || 0)));

  function duelEngine(def) {
    const e = {
      id: def.id,
      minPlayers: 2, maxPlayers: 6, allowBots: true, defaultBots: 2,
      defaultOpts: Object.assign({ mode: 'fast', rounds: 5, count: 5, team: 0 }, def.defaultOpts),
      botNames: ['컴퓨터 A', '컴퓨터 B', '컴퓨터 C', '컴퓨터 D', '컴퓨터 E'],
      canStart(W) {
        if (W.o.mode !== 'rec' && W.o.team) {
          const c = [0, 0];
          W.pl.forEach((x) => { c[x.tm ? 1 : 0]++; });
          if (!c[0] || !c[1]) return '두 팀에 한 명 이상씩 있어야 해요. 「팀 자동 나누기」를 눌러 보세요.';
        }
        return null;
      },
      start(players, o, info) {
        if (o.mode === 'rec') return recStart(players, o, info);
        const n = players.length;
        const G = { mode: 'fast', n, o: Object.assign({}, o), team: o.team ? 1 : 0, tm: players.map((p) => (p.tm ? 1 : 0)), rounds: o.rounds || 5, round: 0, pts: Array(n).fill(0), wrong: Array(n).fill(0), lock: Array(n).fill(0), ph: 'play', win: -1, seed: 0, until: 0, last: null };
        nextRound(G);
        return G;
      },
      act(G, seat, a) {
        if (G.mode === 'rec') return recAct(G, seat, a);
        if (G.ph !== 'play') throw new Error('지금은 답할 수 없어요');
        const now = Date.now();
        if (G.lock[seat] > now) throw new Error('잠겨 있어요. ' + Math.ceil((G.lock[seat] - now) / 1000) + '초 뒤에 다시 답할 수 있어요');
        const pz = puzzleOf(def, G.seed, G.o);
        let ok;
        if (a && a.t === 'ans' && def.kind === 'number') ok = def.check(pz, Number(a.v));
        else if (a && a.t === 'done' && def.kind === 'task') ok = true;
        else throw new Error('잘못된 답이에요');
        if (ok) {
          G.pts[seat]++;
          G.win = seat;
          G.ph = 'reveal';
          G.until = now + REVEAL_MS;
        } else {
          G.wrong[seat]++;
          G.lock[seat] = now + RACE_LOCK;
          G.last = [seat, String(a.v).slice(0, 6)];
        }
      },
      tick(G, now) {
        if (G.mode === 'rec') return false;
        if (G.ph === 'play' && now >= G.until) { G.win = -1; G.ph = 'reveal'; G.until = now + REVEAL_MS; return true; }
        if (G.ph === 'reveal' && now >= G.until) {
          if (G.round >= G.rounds) { G.ph = 'end'; return true; }
          nextRound(G);
          return true;
        }
        return false;
      },
      pending(G) {
        if (G.mode === 'rec') return G.st.map((x, i) => (x.d ? -1 : i)).filter((i) => i >= 0);
        if (G.ph !== 'play') return [];
        const now = Date.now();
        return [...Array(G.n).keys()].filter((s) => G.lock[s] <= now);
      },
      timeLimit() { return 0; },
      botDelay(G, seat) {
        if (G.mode === 'rec') {
          if (!G.bots[seat]) return 30000; // 연결이 끊긴 사람: 30초 기다렸다가 그만둔 것으로
          const pz = puzzleOf(def, G.seeds[G.st[seat].k - 1], G.o);
          return Math.max(0, G.go - netNow()) + def.botTime(pz, G.o) * 1000 * (0.65 + Math.random() * 0.9);
        }
        const pz = puzzleOf(def, G.seed, G.o);
        return def.botTime(pz, G.o) * 1000 * (0.65 + Math.random() * 0.9);
      },
      bot(G, seat) {
        if (G.mode === 'rec') return G.bots[seat] ? { t: 'bot' } : { t: 'quit' };
        const pz = puzzleOf(def, G.seed, G.o);
        if (def.kind === 'task') return { t: 'done' };
        const ans = def.answer(pz);
        if (Math.random() < 0.82) return { t: 'ans', v: ans };
        return { t: 'ans', v: Math.max(0, ans + (Math.random() < 0.5 ? -1 : 1) * (1 + Math.floor(Math.random() * 2))) };
      },
      timeout() { return null; },
      publicView(G) {
        if (G.mode === 'rec') return { mode: 'rec', n: G.cnt, o: G.o, seed: G.seed, go: G.go, key: G.key, ph: G.ph, st: G.st.map((x) => ({ k: x.k, s: x.s, d: x.d, r: x.r, q: x.q })) };
        const now = Date.now();
        return {
          mode: 'fast', team: G.team, tm: G.tm,
          o: G.o, rounds: G.rounds, round: G.round, seed: G.seed, ph: G.ph, pts: G.pts, wrong: G.wrong, win: G.win, last: G.last,
          lockRem: G.lock.map((t) => Math.max(0, t - now)), rem: Math.max(0, G.until - now),
        };
      },
      over(G) { return G.ph === 'end'; },
      results(G) {
        if (G.mode === 'rec') {
          const sums = G.st.map((x) => summarize(decodeEntries(x.r, G.cnt) || []));
          return { rec: true, scores: sums.map((m) => m.solved * 1e7 - Math.round(m.total / 100)) };
        }
        if (G.team) {
          const tp = [0, 0];
          G.pts.forEach((p, i) => { tp[G.tm[i]] += p; });
          const win = tp[0] === tp[1] ? -1 : tp[0] > tp[1] ? 0 : 1;
          return { pts: G.pts, team: tp, scores: G.tm.map((t) => tp[t]), places: G.tm.map((t) => (win < 0 || t === win ? 'live' : 'prison')) };
        }
        return { pts: G.pts, scores: G.pts.slice(), tb: G.wrong.map((w) => -w) };
      },
    };
    function nextRound(G) {
      G.round++;
      G.seed = newSeed();
      puzzleOf(def, G.seed, G.o); // 미리 만들어 둠
      G.ph = 'play';
      G.win = -1;
      G.last = null;
      G.lock = Array(G.n).fill(0);
      G.until = Date.now() + ROUND_MS;
    }
    // 기록 대결: 같은 문제 묶음을 각자 끝까지. 5초 뒤(서버 시각 기준) 같이 시작
    function recStart(players, o, info) {
      const cnt = o.count || 5, seed = newSeed() >>> 0;
      const key = info && info.code ? ('rec-' + info.gameId + '-' + info.code + '-' + seed.toString(36)).toLowerCase().replace(/[^a-z0-9-]/g, '') : null;
      const go = netNow() + 5000;
      return {
        mode: 'rec', cnt, o: Object.assign({}, o), seed, seeds: seedsFrom(seed, cnt), key, go, ph: 'play',
        bots: players.map((p) => !!p.b), st: players.map(() => ({ k: 1, s: 0, d: 0, r: '', q: 0 })), la: players.map(() => go), bt: players.map(() => []),
      };
    }
    function recAct(G, seat, a) {
      const x = G.st[seat];
      if (!x || x.d) throw new Error('이미 다 풀었어요');
      if (a && a.t === 'prog') { x.k = clampInt(a.k, 1, G.cnt); x.s = clampInt(a.s, 0, G.cnt); }
      else if (a && a.t === 'fin') {
        const res = decodeEntries(String(a.r || ''), G.cnt);
        if (!res) throw new Error('기록을 읽지 못했어요');
        x.d = 1; x.r = String(a.r); x.k = G.cnt; x.s = res.filter((r) => r.ok).length;
      } else if (a && a.t === 'bot') {
        const now = netNow();
        const ok = Math.random() < 0.85;
        G.bt[seat].push({ ok, time: Math.max(1500, now - G.la[seat]), wrong: ok ? 0 : 1 });
        G.la[seat] = now;
        if (ok) x.s++;
        if (x.k >= G.cnt) { x.d = 1; x.r = encodeEntries(G.bt[seat]); } else x.k++;
      } else if (a && a.t === 'quit') {
        x.d = 1; x.q = 1; x.r = encodeEntries(Array.from({ length: G.cnt }, () => ({ ok: false, time: 0, wrong: 0 })));
      } else throw new Error('잘못된 행동');
      if (G.st.every((y) => y.d)) G.ph = 'end';
    }
    return e;
  }

  function finePointer() { try { return matchMedia('(hover: hover) and (pointer: fine)').matches; } catch (e) { return false; } }

  // ---------- 숫자 답 입력 줄 ----------
  function answerRow(id, onSubmit, disabled) {
    const inp = h('input', { id, class: 'input ans-input', inputmode: 'numeric', autocomplete: 'off', placeholder: '답', 'aria-label': '답 입력', disabled });
    const btn = h('button', { class: 'btn primary', disabled, onclick: () => go() }, '답하기');
    function go() {
      const t = inp.value.trim().replace(/[^0-9-]/g, '');
      if (t === '' || t === '-') { inp.focus(); return; }
      onSubmit(parseInt(t, 10));
      inp.value = '';
    }
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    return { el: h('div', { class: 'ans-row' }, inp, btn), inp, btn };
  }

  // ---------- 문제 묶음 풀기 (혼자 연습·오늘의 문제·기록 대결 공용) ----------
  // cfg: { seeds, opts, toolbar(): el|null, label, onEnd(results) }
  let tuneNo = 0;
  function problemSet(wrap, ctx, def, cfg) {
    const seeds = cfg.seeds, N = seeds.length, opts = cfg.opts;
    let round = 0, cur = null, dead = false;
    const results = [];
    const tune = 'set:' + def.id + ':' + (++tuneNo); // 배경 음악: 문제를 푸는 동안
    const music = (play) => { if (App.music) { if (play) App.music.claim(tune); else App.music.release(tune); } };

    function next() {
      if (dead) return;
      if (cur && cur.comp && cur.comp.destroy) cur.comp.destroy();
      round++;
      if (round > N) { cur = null; stop(); music(false); cfg.onEnd(results.slice()); return; }
      const pz = puzzleOf(def, seeds[round - 1], opts);
      App.quick.lastPuzzle = pz; // 점검용
      cur = { pz, t0: Date.now(), wrong: 0, lockUntil: 0, done: false, ok: false };
      if (cfg.onProgress) cfg.onProgress(round, results);
      const me = cur;
      cur.comp = def.mount(pz, { done: () => { if (cur === me) finish(true); }, locked: () => Date.now() < me.lockUntil, solo: true });
      draw();
    }

    function submit(v) {
      if (!cur || cur.done || Date.now() < cur.lockUntil) return;
      if (def.check(cur.pz, v)) finish(true);
      else {
        cur.wrong++;
        const lockMs = cfg.lockMs || SOLO_LOCK;
        cur.lockUntil = Date.now() + lockMs;
        cur.msg = v + '개는 아니에요. ' + Math.round(lockMs / 1000) + '초 뒤에 다시 답할 수 있어요.';
        draw();
        const me = cur;
        setTimeout(() => { if (!dead && cur === me && !me.done) { me.msg = '다시 답해 보세요.'; draw(); } }, lockMs + 50);
      }
    }

    function finish(ok) {
      if (!cur || cur.done) return;
      cur.done = true;
      cur.ok = ok;
      const pen = (cur.comp.penalty ? cur.comp.penalty() : 0);
      cur.time = Date.now() - cur.t0 + pen;
      results.push({ ok, time: cur.time, wrong: cur.wrong + (cur.comp.mistakes ? cur.comp.mistakes() : 0), pen });
      if (cfg.onProgress) cfg.onProgress(round, results);
      draw();
      ctx.finished({}); // 한 문제만 끝내도 공략이 열림
    }

    function draw() {
      if (dead || !cur) return;
      App.clear(wrap);
      const tb = cfg.toolbar ? cfg.toolbar() : null;
      if (tb) wrap.append(tb);
      const head = h('div', { class: 'q-head' },
        h('span', { class: 'pill strong' }, (cfg.label || '문제') + ' ' + round + ' / ' + N),
        h('span', { class: 'pill', id: def.id + '-clock' }, App.fmtTime(cur.done ? cur.time : Date.now() - cur.t0)),
        cur.wrong ? h('span', { class: 'pill warn' }, '오답 ' + cur.wrong) : null);
      wrap.append(head);
      if (def.prompt) wrap.append(def.prompt(cur.pz));
      if (!(cur.done && def.explainHasBoard)) wrap.append(cur.comp.el);
      if (!cur.done) {
        if (def.kind === 'number') {
          const locked = Date.now() < cur.lockUntil;
          const row = answerRow(def.id + '-ans', submit, locked);
          wrap.append(row.el);
          // 마우스를 쓰는 컴퓨터에서만 입력칸에 바로 커서를 둠 (휴대폰은 입력칸을 눌러야 키보드가 뜸)
          if (!locked && finePointer()) setTimeout(() => { try { row.inp.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }, 0);
        }
        wrap.append(h('p', { class: 'status', 'aria-live': 'polite' }, cur.msg || ' '));
        wrap.append(h('div', { class: 'row center' }, h('button', { class: 'btn ghost tiny', onclick: () => finish(false) }, '포기하고 정답 보기')));
      } else {
        const last = results[results.length - 1];
        wrap.append(h('div', { class: 'result-box' + (cur.ok ? ' ok' : ' bad') },
          h('strong', { class: 'result-big' }, cur.ok ? App.fmtTime(cur.time) + ' 만에 정답' : '정답 공개'),
          cur.ok && (cur.wrong || last.pen) ? h('p', { class: 'note' }, '오답 ' + last.wrong + '번' + (last.pen ? ' · 벌칙 시간 ' + Math.round(last.pen / 1000) + '초 포함' : '')) : null,
          def.explain(cur.pz),
          h('button', { class: 'btn primary', onclick: next }, round >= N ? '결과 보기' : '다음 문제')));
        if (cur.comp.reveal) cur.comp.reveal();
      }
    }

    const clock = setInterval(() => {
      const el = document.getElementById(def.id + '-clock');
      if (el && cur && !cur.done) el.textContent = App.fmtTime(Date.now() - cur.t0);
    }, 500);
    function stop() { clearInterval(clock); }
    music(true);
    next();
    return {
      destroy() { dead = true; stop(); music(false); if (cur && cur.comp && cur.comp.destroy) cur.comp.destroy(); },
    };
  }

  function resultTable(results) {
    return h('table', { class: 'log' },
      h('thead', null, h('tr', null, ['문제', '결과', '시간', '오답'].map((x) => h('th', null, x)))),
      h('tbody', null, results.map((r, i) => h('tr', null, h('td', null, i + 1), h('td', null, r.ok ? '정답' : '포기'), h('td', { class: 'mono' }, App.fmtTime(r.time)), h('td', null, r.wrong || 0)))));
  }

  // ---------- 혼자 연습 ----------
  function solo(root, ctx, def) {
    const ROUNDS = def.soloRounds || 5;
    let opts = Object.assign({}, def.defaultOpts, App.store.get(def.id + '.opts', {}));
    let set = null;
    const wrap = h('div', { class: 'quick' });
    root.append(wrap);

    function saveOpts() { App.store.set(def.id + '.opts', opts); }
    function setOpt(k, v) { opts[k] = v; saveOpts(); restart(); }
    function restart() {
      if (set) set.destroy();
      set = problemSet(wrap, ctx, def, { seeds: Array.from({ length: ROUNDS }, newSeed), opts: Object.assign({}, opts), toolbar, onEnd: summary });
    }

    function toolbar() {
      const bar = h('div', { class: 'toolbar' });
      def.optionsUI(bar, opts, setOpt, false);
      bar.append(
        h('button', { class: 'btn tiny', onclick: () => { opts = Object.assign({}, opts, def.randomOpts()); saveOpts(); restart(); } }, '랜덤 변형'),
        h('button', { class: 'btn tiny ghost', onclick: restart }, '처음부터'));
      return bar;
    }

    function summary(results) {
      App.clear(wrap);
      wrap.append(toolbar());
      const solved = results.filter((r) => r.ok);
      const total = results.reduce((a, r) => a + r.time, 0);
      wrap.append(h('div', { class: 'result-box' },
        h('strong', { class: 'result-big' }, solved.length + ' / ' + ROUNDS + ' 정답'),
        h('p', null, '총 ' + App.fmtTime(total) + (solved.length ? ' · 맞힌 문제 평균 ' + App.fmtTime(solved.reduce((a, r) => a + r.time, 0) / solved.length) : '')),
        resultTable(results),
        h('button', { class: 'btn primary', onclick: restart }, '한 번 더'),
        h('p', { class: 'note' }, '다른 사람과 순위를 겨뤄 보고 싶다면 위의 「오늘의 문제」나 「온라인 대결」을 해 보세요.')));
    }

    restart();
    return () => { if (set) set.destroy(); };
  }

  // ---------- 기록·순위 공용 도구 ----------
  const SHARE_URL = App.SHARE_URL || 'https://claude.ai/artifact/7PS8wBkQySgG8HmrkLpRRG';
  const hasServer = () => !!(App.fire && App.fire.enabled && App.fire.enabled());
  // 서버에 붙을 수 있으면 요청, 아니면 {code:'full'} 로 실패 (가득 찬 동안 요청이 끝없이 멈춰 있는 것을 막음)
  async function serverCall(fn, ms) {
    if (!(await App.fire.ready(9000))) throw { code: 'full' };
    return App.fire.wait(fn(), ms || 10000);
  }
  const downNote = (e) => (e && (e.code === 'full' || e.code === 'timeout') ? App.fire.problemText() : '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
  const myNick = () => App.cleanNick(App.store.get('nick', ''));
  const pad2 = (x) => String(x).padStart(2, '0');
  function optLabel(def, opts) {
    const tmp = h('div');
    def.optionsUI(tmp, opts, () => {}, true);
    return [...tmp.querySelectorAll('.seg-btn.on')].map((b) => b.textContent).join(' · ');
  }
  // 문제별 기록을 짧은 글자로: 정답이면 시간(0.1초, 36진수), 포기면 앞에 !, 오답 수는 ~숫자
  function encodeEntries(res) { return res.map((r) => (r.ok ? '' : '!') + Math.round(r.time / 100).toString(36) + (r.wrong ? '~' + Math.min(99, r.wrong) : '')).join(','); }
  function decodeEntries(s, n) {
    const parts = String(s).split(',');
    if (parts.length !== n) return null;
    const out = [];
    for (const p of parts) {
      const m = p.match(/^(!?)([0-9a-z]{1,6})(?:~(\d{1,2}))?$/);
      if (!m) return null;
      out.push({ ok: !m[1], time: parseInt(m[2], 36) * 100, wrong: m[3] ? +m[3] : 0 });
    }
    return out;
  }
  function summarize(res) {
    return { solved: res.filter((r) => r.ok).length, total: res.reduce((a, r) => a + r.time, 0), wrong: res.reduce((a, r) => a + (r.wrong || 0), 0) };
  }
  function fmtLong(ms) { const s = Math.round(ms / 1000); return (s >= 60 ? Math.floor(s / 60) + '분 ' : '') + (s % 60) + '초'; }
  // 순위: 맞힌 문제가 많을수록, 같으면 총 시간이 짧을수록 위
  function rankRows(rows, n) {
    const all = rows.map((x) => { const res = decodeEntries(x.r, n); return res ? { name: App.cleanNick(x.name), me: !!x.me, s: summarize(res) } : null; }).filter(Boolean);
    all.sort((a, b) => b.s.solved - a.s.solved || a.s.total - b.s.total);
    all.forEach((r, i) => { const p = all[i - 1]; r.rank = p && p.s.solved === r.s.solved && p.s.total === r.s.total ? p.rank : i + 1; });
    return all;
  }
  const topPct = (rank, N) => Math.max(1, Math.round(rank / N * 100));
  function copyText(text) {
    return new Promise((resolve) => {
      const fallback = () => {
        try {
          const ta = h('textarea', { style: { position: 'fixed', top: '0', left: '0', opacity: '0' } });
          ta.value = text; document.body.append(ta); ta.select();
          const ok = document.execCommand('copy'); ta.remove(); resolve(!!ok);
        } catch (e) { resolve(false); }
      };
      try { navigator.clipboard.writeText(text).then(() => resolve(true), fallback); } catch (e) { fallback(); }
    });
  }
  function shareBlock(label, text) {
    const ta = h('textarea', { class: 'input share-text', rows: '4', readonly: true, 'aria-label': '보낼 글' });
    ta.value = text;
    const det = h('details', { class: 'share-det' }, h('summary', null, '보낼 글 미리 보기'), ta);
    const btn = h('button', { class: 'btn primary big', onclick: async () => {
      const ok = await copyText(text);
      if (ok) App.toast('복사했어요. 카톡 대화창에 붙여 넣어 보내세요.');
      else { App.toast('자동 복사가 막혀 있어요. 아래 글을 길게 눌러 복사해 주세요.', 'warn'); det.open = true; ta.focus(); ta.select(); }
    } }, '📋 ' + label);
    return h('div', { class: 'share-block' }, btn, det);
  }
  function nickField(id) {
    const inp = h('input', { id, class: 'input', maxlength: '12', placeholder: '닉네임', value: App.store.get('nick', '') });
    inp.addEventListener('input', () => App.store.set('nick', inp.value));
    return h('label', { class: 'field', for: id }, h('span', null, '내 닉네임 (순위에 표시돼요)'), inp);
  }

  // 서버에 모인 기록으로 순위 상자 (N명 중 N위, 상위 %, 평균 시간)
  function rankBox(key, n, o) {
    const box = h('section', { class: 'rank-box', 'aria-live': 'polite' }, h('p', { class: 'note center-text' }, '순위를 불러오는 중…'));
    let offOk = null, started = false;
    const stopWatch = () => { if (offOk) { offOk(); offOk = null; } };
    function retry() { stopWatch(); App.clear(box); box.append(h('p', { class: 'note center-text' }, '순위를 불러오는 중…')); load(); }
    function load() {
      started = true;
      serverCall(async () => {
        let rows = await App.fire.results(key);
        // 서버가 가득 찼을 때 끝낸 기록은 이 기기에만 있음 → 연결되면 그때 올림
        const local = o.localKey ? App.store.get(o.localKey, null) : null;
        if (local && local.r && !rows.some((x) => x.me) && (await App.fire.saveResult(key, myNick(), local.r))) rows = await App.fire.results(key);
        return rows;
      }, 15000).then((rows) => {
        App.clear(box);
        const all = rankRows(rows, n);
        const me = all.find((r) => r.me);
        const N = all.length;
        const avg = N ? all.reduce((a, r) => a + r.s.total, 0) / N : 0;
        const top = all.slice(0, 10);
        if (me && !top.includes(me)) top.push(me);
        box.append(
          h('div', { class: 'result-box ok' },
            h('p', { class: 'note' }, o.title),
            h('strong', { class: 'result-big' }, me ? N + '명 중 ' + me.rank + '위' : N + '명 참가'),
            me ? h('p', null, '상위 ' + topPct(me.rank, N) + '% · 내 기록 ' + me.s.solved + '/' + n + ' 정답 · ' + fmtLong(me.s.total)) : null,
            h('p', { class: 'note' }, N ? '참가자 평균 ' + fmtLong(avg) + ' · 1위 ' + all[0].name + ' ' + fmtLong(all[0].s.total) : '아직 기록이 없어요.')),
          N ? h('table', { class: 'log rank' },
            h('thead', null, h('tr', null, ['순위', '이름', '정답', '총 시간'].map((x) => h('th', null, x)))),
            h('tbody', null, top.map((r) => h('tr', { class: r.me ? 'me' : '' }, h('td', null, r.rank), h('td', null, r.name, r.me ? ' (나)' : ''), h('td', null, r.s.solved + '/' + n), h('td', { class: 'mono' }, App.fmtTime(r.s.total)))))) : null,
          h('div', { class: 'row center' }, h('button', { class: 'btn tiny ghost', onclick: () => { App.clear(box); box.append(h('p', { class: 'note center-text' }, '순위를 불러오는 중…')); load(); } }, '↻ 순위 새로고침')),
          me && o.share ? shareBlock('결과 공유하기', o.share(me, N)) : null);
      }).catch((e) => {
        if (!box.isConnected && started) return;
        App.clear(box);
        const mine = o.localKey && App.store.get(o.localKey, null);
        const m = mine && mine.r ? summarize(decodeEntries(mine.r, n) || []) : null;
        box.append(
          m ? h('div', { class: 'result-box ok' }, h('p', { class: 'note' }, o.title), h('strong', { class: 'result-big' }, m.solved + ' / ' + n + ' 정답 · ' + fmtLong(m.total))) : null,
          h('p', { class: 'note warn-note' }, downNote(e)),
          m ? h('p', { class: 'note center-text' }, '내 기록은 이 기기에 저장해 두었어요. 이 화면을 열어 둔 채 서버에 연결되면 순위에 자동으로 올라가요.') : null,
          h('div', { class: 'row center' }, h('button', { class: 'btn tiny', onclick: retry }, '다시 시도')));
        // 서버에 다시 연결되면 저절로 다시 불러오고(이 기기 기록도 올림)
        if (!offOk) offOk = App.fire.onStatus((st) => {
          if (!box.isConnected) { stopWatch(); return; }
          if (st === 'ok') { stopWatch(); retry(); }
        });
      });
    }
    load();
    return box;
  }

  // 같은 문제 묶음을 풀고 서버 순위에 넣는 화면 (오늘의 문제, 기록 대결을 나중에 풀기)
  // cfg: { key, seeds, opts, n, localKey, head, sub, lead, barLabel, title, share(me,N), leave }
  function setFlow(box, ctx, def, cfg) {
    let ps = null;
    const stop = () => { if (ps) { ps.destroy(); ps = null; } };
    const put = (...els) => box.append(...els.filter(Boolean));
    const top = () => { try { box.scrollIntoView({ block: 'start' }); } catch (e) { /* 무시 */ } };
    const leaveBtn = cfg.leave ? h('button', { class: 'btn ghost', onclick: () => { stop(); cfg.leave(); } }, '나가기') : null;
    function intro() {
      stop(); App.clear(box);
      if (App.store.get(cfg.localKey, null)) { result(); return; }
      const stats = h('p', { class: 'note' }, hasServer() ? '참가 현황을 불러오는 중…' : '');
      put(
        cfg.lead ? h('p', { class: 'chal-lead' }, cfg.lead) : null,
        h('section', { class: 'room-made' }, h('p', { class: 'room-made-head' }, cfg.head), h('p', { class: 'room-made-sub' }, cfg.sub), stats),
        nickField(def.id + '-set-nick'),
        h('div', { class: 'row center wrap' }, h('button', { class: 'btn primary big', onclick: () => { play(false); top(); } }, '시작하기'), leaveBtn));
      if (hasServer()) {
        serverCall(() => App.fire.results(cfg.key)).then((rows) => {
          const all = rankRows(rows, cfg.n);
          if (all.some((r) => r.me)) { App.store.set(cfg.localKey, { at: Date.now() }); if (stats.isConnected) result(); return; }
          const avg = all.length ? all.reduce((a, r) => a + r.s.total, 0) / all.length : 0;
          stats.textContent = all.length ? '지금까지 ' + all.length + '명 참가 · 평균 ' + fmtLong(avg) : '아직 아무도 안 풀었어요. 첫 번째로 풀어 보세요!';
        }).catch((e) => { stats.textContent = downNote(e) + ' 문제는 지금 풀 수 있고, 기록은 연결되면 올라가요.'; stats.classList.add('warn-note'); });
      }
    }
    function play(practice) {
      stop(); App.clear(box);
      const body = h('div', { class: 'quick' });
      put(
        h('div', { class: 'mp-bar' }, h('span', { class: 'bar-label' }, practice ? '다시 풀기 (순위에 안 들어가요)' : cfg.barLabel), h('span', { class: 'spacer' }),
          h('button', { class: 'btn tiny ghost', onclick: () => (practice ? result() : intro()) }, '그만두기')),
        body);
      ps = problemSet(body, ctx, def, { seeds: cfg.seeds, opts: cfg.opts, label: '문제', lockMs: practice ? SOLO_LOCK : RACE_LOCK, onEnd: async (results) => {
        ps = null;
        if (practice) { const m = summarize(results); result('다시 푼 기록: ' + m.solved + '/' + cfg.n + ' 정답 · ' + fmtLong(m.total) + ' (순위에는 처음 기록만 들어가요)'); top(); return; }
        const r = encodeEntries(results);
        App.store.set(cfg.localKey, { r, at: Date.now() });
        App.clear(box); put(h('p', { class: 'note center-text' }, '기록을 저장하는 중…'));
        if (hasServer()) { try { await serverCall(() => App.fire.saveResult(cfg.key, myNick(), r)); } catch (e) { /* 순위 상자에서 연결되면 다시 올림 */ } }
        if (!box.isConnected) return;
        result(); top();
      } });
    }
    function result(note) {
      stop(); App.clear(box);
      const local = App.store.get(cfg.localKey, null);
      const mine = local && local.r ? summarize(decodeEntries(local.r, cfg.n) || []) : null;
      put(
        note ? h('p', { class: 'note strong center-text' }, note) : null,
        hasServer() ? rankBox(cfg.key, cfg.n, { title: cfg.title, share: cfg.share, localKey: cfg.localKey })
          : h('div', { class: 'result-box ok' }, h('p', { class: 'note' }, cfg.title), mine ? h('strong', { class: 'result-big' }, mine.solved + ' / ' + cfg.n + ' 정답 · ' + fmtLong(mine.total)) : null, h('p', { class: 'note' }, '전체 순위는 온라인에 연결된 사이트에서 볼 수 있어요.')),
        h('div', { class: 'row center wrap' }, h('button', { class: 'btn ghost', onclick: () => { play(true); top(); } }, '같은 문제 다시 풀기'), leaveBtn));
    }
    intro();
    return stop;
  }

  // ---------- 오늘의 문제: 날마다 모두에게 같은 문제, 전체 순위 ----------
  function kstDay(ms) { const d = new Date(ms + 9 * 3600e3); return { ymd: d.toISOString().slice(0, 10).replace(/-/g, ''), label: (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일' }; }
  function hashStr(s) { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
  function daily(root, ctx, def) {
    const wrap = h('div', { class: 'chal' });
    root.append(wrap);
    const day = kstDay(netNow());
    const n = def.dailyCount || 5;
    const opts = Object.assign({}, def.defaultOpts, def.dailyOpts);
    const key = 'day-' + def.id + '-' + day.ymd;
    return setFlow(wrap, ctx, def, {
      key, seeds: seedsFrom(hashStr(key), n), opts, n, localKey: 'daily.' + key,
      head: '📅 ' + day.label + ' 오늘의 문제', sub: def.name + ' · ' + optLabel(def, opts) + ' · ' + n + '문제',
      lead: '오늘 이 문제를 푼 모든 사람과 순위를 겨뤄요. 하루에 첫 기록만 순위에 들어가고, 내일은 새 문제가 나와요.',
      barLabel: '📅 오늘의 문제', title: day.label + ' 오늘의 문제 · ' + def.name,
      share: (me, N) => '🧠 [' + def.name + '] ' + day.label + ' 오늘의 문제\n' + N + '명 중 ' + me.rank + '위 (상위 ' + topPct(me.rank, N) + '%) · ' + me.s.solved + '/' + n + ' 정답 · ' + fmtLong(me.s.total) + '\n나도 도전 → ' + SHARE_URL,
    });
  }

  // ---------- 온라인 대결 화면 ----------
  function race(root, ctx, def) {
    const engine = duelEngine(def);
    const tagEl = (t, c) => h('span', { class: 'chip-tag' + (c ? ' ' + c : '') }, t);
    const segRow = (label, key, list, W, s, disabled) => [label ? h('span', { class: 'opt-label' }, label) : null,
      h('div', { class: 'seg small' }, list.map(([v, l]) => h('button', { class: 'seg-btn' + (W.o[key] === v ? ' on' : ''), disabled, onclick: () => s.setOpt(key, v) }, l)))].filter(Boolean);

    // 늦게 온 사람: 방장이 떠난 기록 대결은 서버에 남은 문제 묶음으로 풀기
    async function lateJoin(code) {
      if (!hasServer()) return null;
      const set = await App.fire.getSet((def.id + '-' + code).toLowerCase());
      if (!set || !set.key || !set.n || set.seed == null) return null;
      return (leave) => {
        const box = h('div', { class: 'chal' });
        const opts = Object.assign({}, def.defaultOpts, set.o);
        const when = set.at ? new Date(set.at) : null;
        box._stop = setFlow(box, ctx, def, {
          key: set.key, seeds: seedsFrom(set.seed, set.n), opts, n: set.n, localKey: 'rec.' + set.key,
          head: '📨 방 코드 ' + code + ' 기록 대결', sub: def.name + ' · ' + optLabel(def, opts) + ' · ' + set.n + '문제' + (when ? ' · ' + (when.getMonth() + 1) + '/' + when.getDate() + ' ' + pad2(when.getHours()) + ':' + pad2(when.getMinutes()) + ' 시작' : ''),
          lead: '방장은 이미 나갔지만, 같은 문제를 풀면 이 대결의 순위에 합쳐져요.',
          barLabel: '기록 대결 ' + code, title: '방 코드 ' + code + ' 기록 대결 · ' + def.name, leave,
          share: (me, N) => '🧠 [' + def.name + '] 기록 대결 ' + code + '\n' + N + '명 중 ' + me.rank + '위 · ' + me.s.solved + '/' + set.n + ' 정답 · ' + fmtLong(me.s.total) + '\n같은 문제 풀기: 「' + def.name + '」 → 「온라인 대결」 → 방 코드 ' + code + '\n' + SHARE_URL,
        });
        return box;
      };
    }

    // 기록 대결 화면이 만든 문제 묶음·카운트다운·늦게 푸는 화면 정리 (나가기, 다음 판, 화면 닫기)
    function disposeRec(s) {
      const L = s.local;
      if (L.set && L.set.destroy) L.set.destroy();
      L.set = null;
      clearInterval(L.cd); L.cd = null;
      if (L.lateStop) { L.lateStop(); L.lateStop = null; }
    }

    function progressPills(W, st, me) {
      const els = W.pl.map((p, i) => {
        if (i === me) return null;
        const x = st.st[i];
        return h('span', { class: 'pill' + (x.d ? ' win' : '') }, h('b', null, p.n), ' ', x.d ? (x.q ? '그만뒀어요' : '다 풀었어요 · ' + x.s + '개 정답') : x.k + '/' + st.n + '번 · ' + x.s + '개 정답');
      }).filter(Boolean);
      return els.length ? h('div', { class: 'live-strip', 'aria-live': 'polite' }, els) : null;
    }

    function renderRec(g, s) {
      const W = s.W, st = W.s, me = s.mySeat, L = s.local;
      const gk = W.gn + ':rec';
      if (L.key !== gk) {
        disposeRec(s);
        Object.assign(L, { key: gk, set: null, fin: null, cd: null, seeds: seedsFrom(st.seed, st.n), wrap: h('div', { class: 'quick' }), setSaved: false, lateBox: null, lateStop: null, allBox: null });
      }
      // 방장: 나중에 같은 방 코드로 오는 사람을 위해 문제 묶음을 서버에 남김
      if (s.isHost && st.key && !L.setSaved && hasServer()) { L.setSaved = true; App.fire.putSet((def.id + '-' + s.code).toLowerCase(), st.key, { g: def.id, o: st.o, n: st.n, seed: st.seed }); }
      g.append(h('div', { class: 'q-head' }, h('span', { class: 'pill strong' }, '기록 대결 · ' + st.n + '문제'), h('span', { class: 'pill' }, optLabel(def, st.o))));
      // 시작 전 카운트다운
      if (W.ph !== 'end' && me >= 0 && netNow() < st.go) {
        const big = h('div', { class: 'count-big', 'aria-live': 'assertive' });
        g.append(h('section', { class: 'room-made count-wait' }, h('p', { class: 'room-made-head' }, '곧 다 같이 시작해요!'), big));
        const paint = () => {
          const rem = st.go - netNow();
          if (rem <= 0) { clearInterval(L.cd); L.cd = null; s.onUpdate(s); return; }
          const t = String(Math.min(5, Math.ceil(rem / 1000)));
          if (big.textContent !== t) { big.textContent = t; big.classList.remove('tick'); void big.offsetWidth; big.classList.add('tick'); }
        };
        clearInterval(L.cd); L.cd = setInterval(paint, 100); paint();
        return;
      }
      clearInterval(L.cd); L.cd = null;
      // 푸는 중
      if (me >= 0 && !L.fin && !st.st[me].d && W.ph !== 'end') {
        if (!L.set) {
          L.set = 'starting';
          setTimeout(() => {
            if (s.closed || s._disposed || s.local !== L || L.key !== gk || L.set !== 'starting') return;
            L.set = problemSet(L.wrap, ctx, def, { seeds: L.seeds, opts: st.o, label: '문제', lockMs: RACE_LOCK,
              onProgress: (round, results) => { const ok = results.filter((r) => r.ok).length; setTimeout(() => s.send({ t: 'prog', k: Math.min(round, st.n), s: ok }), 0); },
              onEnd: (results) => {
                L.set = null; L.fin = results;
                const r = encodeEntries(results);
                s.send({ t: 'fin', r });
                if (st.key && hasServer()) App.fire.saveResult(st.key, myNick(), r);
                s.onUpdate(s);
              } });
          }, 0);
        }
        g.append(progressPills(W, st, me) || '', L.wrap);
        return;
      }
      // 다 풀었거나 끝남: 방 순위
      const rows = W.pl.map((p, i) => {
        const x = st.st[i];
        const res = x.d ? decodeEntries(x.r, st.n) : null;
        return { i, name: p.n, me: i === me, x, m: res ? summarize(res) : null };
      });
      const done = rows.filter((r) => r.m && !r.x.q).sort((a, b) => b.m.solved - a.m.solved || a.m.total - b.m.total);
      const myRank = done.findIndex((r) => r.me) + 1;
      if (W.ph !== 'end') g.append(h('p', { class: 'status' }, me >= 0 ? '다 풀었어요! 다른 사람이 끝나기를 기다리는 중…' : '기록 대결이 진행 중이에요.'), progressPills(W, st, me) || '');
      else g.append(h('div', { class: 'result-box ok' }, h('strong', { class: 'result-big' }, myRank ? done.length + '명 중 ' + myRank + '위' : '기록 대결 끝'), myRank ? h('p', null, '상위 ' + topPct(myRank, done.length) + '% · 내 기록 ' + done[myRank - 1].m.solved + '/' + st.n + ' 정답 · ' + fmtLong(done[myRank - 1].m.total)) : null,
        done.length ? h('p', { class: 'note' }, '평균 ' + fmtLong(done.reduce((a, r) => a + r.m.total, 0) / done.length)) : null));
      g.append(h('table', { class: 'log rank' },
        h('thead', null, h('tr', null, ['순위', '이름', '정답', '총 시간'].map((x) => h('th', null, x)))),
        h('tbody', null, done.map((r, k) => h('tr', { class: r.me ? 'me' : '' }, h('td', null, k + 1), h('td', null, r.name, r.me ? ' (나)' : ''), h('td', null, r.m.solved + '/' + st.n), h('td', { class: 'mono' }, App.fmtTime(r.m.total)))),
          rows.filter((r) => !r.m || r.x.q).map((r) => h('tr', null, h('td', null, '-'), h('td', null, r.name), h('td', { colspan: '2' }, r.x.q ? '그만뒀어요' : '푸는 중 ' + r.x.k + '/' + st.n + '번'))))));
      // 나중에 푼 사람까지 합친 순위
      if (W.ph === 'end' && st.key && hasServer() && me >= 0) {
        if (!L.allBox) {
          L.allBox = h('div', { class: 'all-rank' });
          L.allBox.append(h('button', { class: 'btn ghost', onclick: () => { App.clear(L.allBox); L.allBox.append(rankBox(st.key, st.n, { title: '방 코드 ' + s.code + ' 기록 대결 · 나중에 푼 사람 포함 (컴퓨터 제외)' })); } }, '나중에 푼 사람까지 합친 순위 보기'),
            h('p', { class: 'note center-text' }, '친구에게 방 코드 ' + s.code + '를 알려 주면, 나중에 「참가하기」로 같은 문제를 풀고 이 순위에 들어올 수 있어요.'));
        }
        g.append(L.allBox);
      }
      // 자리가 없어 보기만 하는 사람: 같은 문제를 따로 풀고 순위에 합치기
      if (me < 0 && st.key && hasServer()) {
        if (!L.lateBox) {
          L.lateBox = h('div', { class: 'chal' });
          L.lateStop = setFlow(L.lateBox, ctx, def, { key: st.key, seeds: L.seeds, opts: st.o, n: st.n, localKey: 'rec.' + st.key,
